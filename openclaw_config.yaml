openclaw:
  version: "2026.3.12"
  mode: local
  log_level: INFO
  workspace: ${OPENCLAW_WORKSPACE}

repositories:
  culturemech:
    path: ${CULTUREMECH_ROOT}
    type: python
    package_manager: uv
    task_runner: just
    description: "Knowledge base with 10,657 culture media recipes"

  mediaingredientmech:
    path: ${MEDIAINGREDIENTMECH_ROOT}
    type: python
    package_manager: uv
    task_runner: just
    description: "LLM-assisted curation system for 1,131 ingredients"

  communitymech:
    path: ${COMMUNITYMECH_ROOT}
    type: python
    package_manager: uv
    task_runner: just
    description: "Microbial community modeling with ecological interactions"

  traitmech:
    path: ${TRAITMECH_ROOT}
    type: python
    package_manager: uv
    task_runner: just
    description: "Knowledge base of microbial ecophysiological traits"

  proteintraitsmech:
    path: ${PROTEINTRAITSMECH_ROOT}
    type: python
    package_manager: uv
    task_runner: just
    description: "Ontology-derived protein-trait corpus"

agents:
  discovery_paths:
    - agents/code_development
    - agents/data_pipeline
    - agents/build_deployment
    - agents/dev_workflow

  defaults:
    temperature: 0.1
    max_tokens: 4096
    timeout: 300
    retry_on_failure: true
    max_retries: 3

plugins:
  enabled:
    - just_runner
    - linkml_validator
    - oak_query
    - git_integration
    - lock_manager
    - ingredient_deduplicator
    - ingredient_repo_synchronizer

  paths:
    - plugins/

pipelines:
  unified_ingredient_mapping:
    description: "Unified ingredient mapping orchestration across CultureMech and MediaIngredientMech"
    batch_size: 20
    auto_accept_threshold: 0.90
    max_cost_per_run: 5.00
    dry_run_default: true
    quality_gates:
      - schema_validation
      - ontology_validation
      - confidence_threshold
    canonical_storage: ${OPENCLAW_WORKSPACE}/canonical_ingredients
    sync_mode: bidirectional
    deduplication_strategies:
      - exact_match
      - chebi_id_match
      - synonym_overlap
    min_synonym_overlap: 0.5

safety:
  require_approval_for:
    - git_push
    - file_deletion
    - schema_changes
    - data_imports
    - cross_repo_operations

  create_backups: true
  backup_directory: ${OPENCLAW_WORKSPACE}/.backups

  allowed_operations:
    read: true
    write_new_files: true
    edit_existing_files: true
    delete_files: false  # Requires approval
    git_operations: true
    network_access: true

monitoring:
  enable_logging: true
  log_directory: ${OPENCLAW_WORKSPACE}/logs
  metrics_enabled: true
  cost_tracking: true
  max_cost_per_run: 10.00  # USD

performance:
  parallel_agents: 3
  cache_enabled: true
  cache_ttl: 3600  # seconds
