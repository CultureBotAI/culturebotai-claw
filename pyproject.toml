[project]
name = "kg-microbe-orchestration"
version = "0.1.0"
description = "OpenClaw orchestration layer for KG-Microbe repositories (CultureMech, MediaIngredientMech, CommunityMech)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "KG-Microbe Team"}
]
dependencies = [
    "anthropic>=0.85.0",
    "click>=8.3.1",
    "gitpython>=3.1.46",
    "openclaw==2026.3.12",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "watchdog>=6.0.0",
    "python-dotenv>=1.2.2",
    "oaklib>=0.6.23",
]

[project.scripts]
openclaw-cli = "cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
packages = ["cli", "plugins", "pipelines"]

[tool.uv]
package = true

[tool.pytest.ini_options]
# Without pythonpath the suites cannot import `plugins` or `src/` and pytest
# aborts during collection — which is how 116 collectable tests sat unrun.
pythonpath = [".", "src"]
# Only `test_*.py`. The default also matches `*_test.py`, which swept in
# `run_pilot_test.py` — a one-off pilot driver for the retired LockManager, not
# a test.
python_files = ["test_*.py"]
# shared/idlabel/tests are the VENDORED fleet tests. They are already run by
# `.github/workflows/id-label-canon.yaml`, which is green nightly and gives them
# what they need: Python 3.13, a fresh oaklib, and `shared/idlabel` as the working
# directory (they resolve the validator at ../scripts relative to themselves).
# Running them from the repo root under this project's 3.10 pin fails on an
# unrelated oaklib/enum incompatibility, so exclude them here rather than
# duplicate — and weaken — a check that already exists.
norecursedirs = ["shared/idlabel", ".venv", "workspace", "cache", "ATTIC"]
