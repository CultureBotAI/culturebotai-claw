[project]
name = "kg-microbe-orchestration"
version = "0.1.0"
description = "OpenClaw orchestration layer for KG-Microbe repositories (CultureMech, MediaIngredientMech, CommunityMech)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "KG-Microbe Team"}
]
dependencies = [
    "anthropic>=0.85.0",
    "click>=8.3.1",
    "gitpython>=3.1.46",
    "openclaw==2026.3.12",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "watchdog>=6.0.0",
    "python-dotenv>=1.2.2",
    "oaklib>=0.6.23",
]

[project.scripts]
openclaw-cli = "cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
packages = ["cli", "plugins", "pipelines"]

[tool.uv]
package = true
