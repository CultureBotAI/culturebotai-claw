# Canonical fleet manifest.
#
# This file is the single source of truth for which repositories constitute the
# Mech fleet. Before it existed, at least three independent lists disagreed:
# `plugins/repository_settings.py` and `cli/main.py` knew three Mechs, the
# cross-mech-sync skill knew four, and `scripts/fleet_pr_status.py` knew five.
# Every fleet-facing component must derive its repository list from here rather
# than re-declaring one. `tests/test_fleet_manifest.py` enforces that for the
# components it names (currently `cli/main.py` and
# `plugins/repository_settings.py`) and checks that `openclaw_config.yaml` and
# `.env.example` match. It is not yet a repo-wide guarantee: several other
# components still carry their own list, tracked in issue #131. Extend the
# guard's parametrize list as each one is converted.
#
# Scope note: this manifest deliberately carries only fields that were verified
# against the repositories when it was written — identity, environment variable,
# vendored-sync role, and capability status. Richer per-Mech profile data
# (schema paths, record globs, research focuses) is added by later phases of
# `docs/reviews/2026-08-24-mech-general-functionality-standardization-plan.md`
# rather than guessed at here.

version: 1

# Capability status vocabulary.
#
#   enabled         the capability is implemented and expected to run
#   disabled        applicable, but deliberately switched off for now
#   not_applicable  structurally does not apply to this repository
#
# `disabled` and `not_applicable` both require a `reason`. That requirement is
# enforced by the loader, not merely documented, so a capability can never be
# silently dropped without a recorded justification.
capability_statuses:
  - enabled
  - disabled
  - not_applicable

# Vendored shared-file governance roles.
#
#   hub    holds the canonical copy that spokes diff against
#   spoke  vendors byte-identical copies and checks them against the hub
#
# Today CultureMech is the hub (`shared/spoke/scripts/check_vendored_sync.sh`
# pins `CANON_REPO="CultureBotAI/CultureMech"`). Phase 1 of the standardization
# plan proposes moving that authority to claw; this manifest records the
# current state, not the intended end state.
vendored_hub: culturemech

mechs:
  culturemech:
    display_name: CultureMech
    github: CultureBotAI/CultureMech
    environment_variable: CULTUREMECH_ROOT
    vendored_role: hub
    capabilities:
      id_label_validation:
        status: enabled
      curation_history:
        status: enabled
      knowledge_gap_scan:
        status: enabled
      vendored_sync:
        status: not_applicable
        reason: >-
          Canonical hub for the vendored shared files. A hub-side copy of
          check_vendored_sync.sh would diff the hub against itself, which is
          the self-referential-pin anti-pattern the spoke design replaced.

  mediaingredientmech:
    display_name: MediaIngredientMech
    github: CultureBotAI/MediaIngredientMech
    environment_variable: MEDIAINGREDIENTMECH_ROOT
    vendored_role: spoke
    capabilities:
      id_label_validation:
        status: enabled
      curation_history:
        status: enabled
      knowledge_gap_scan:
        status: enabled
      vendored_sync:
        status: enabled

  communitymech:
    display_name: CommunityMech
    github: CultureBotAI/CommunityMech
    environment_variable: COMMUNITYMECH_ROOT
    vendored_role: spoke
    capabilities:
      id_label_validation:
        status: enabled
      curation_history:
        status: enabled
      knowledge_gap_scan:
        status: enabled
      vendored_sync:
        status: enabled

  traitmech:
    display_name: TraitMech
    github: CultureBotAI/TraitMech
    environment_variable: TRAITMECH_ROOT
    vendored_role: spoke
    capabilities:
      id_label_validation:
        status: enabled
      curation_history:
        status: enabled
      knowledge_gap_scan:
        status: enabled
      vendored_sync:
        status: enabled

  proteintraitsmech:
    # The GitHub slug is lowercase while the display name is CamelCase. Code
    # that reconstructs the identity from the display name gets a 404, so the
    # `github` field below is authoritative.
    display_name: ProteinTraitsMech
    github: CultureBotAI/proteintraitsmech
    environment_variable: PROTEINTRAITSMECH_ROOT
    vendored_role: spoke
    capabilities:
      id_label_validation:
        status: enabled
      curation_history:
        status: enabled
      knowledge_gap_scan:
        status: not_applicable
        reason: >-
          Record-level knowledge-gap scanning targets curated per-record
          discussion text. This corpus is ontology-derived, so there is no
          per-record gap surface to scan; the repository is correspondingly
          absent from the knowledge-gap-scan workflow matrix.
      vendored_sync:
        status: enabled
