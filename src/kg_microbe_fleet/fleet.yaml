        reason_claims:
          absent: ["proposals"]
      kgx_export:
        status: disabled
        reason: >-
          Consumes kg-microbe KGX as an input but does not yet emit a graph
          product. KGX export applies here, as to every Mech (#503); adoption
          is pending (TaxonMech#78).
      source_queue:
        status: disabled
        reason: >-
          Sources are configured in conf/sources.yaml and inventoried in
          data/raw/MANIFEST.yaml; no curation/source_queue.tsv ranks candidate
          sources. Enable once that review queue is adopted.
        reason_claims:
          present: ["conf/sources.yaml", "data/raw/MANIFEST.yaml"]
          absent: ["curation/source_queue.tsv"]
      site_contract:
        status: enabled
        settings:
          site_path: pages
      source_catalogue:
        status: disabled
        reason: >-
          Uses conf/sources.yaml and data/raw/MANIFEST.yaml but has no
