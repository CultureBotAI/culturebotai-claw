  antibioticmech:
    # Joined 2026-09-02 (#279, AntibioticMech#29). Every capability decision
    # below was measured against this repository's tracked files on origin/main
    # at that date; each disabled/not_applicable status names what would flip it.
    display_name: AntibioticMech
    github: CultureBotAI/AntibioticMech
    environment_variable: ANTIBIOTICMECH_ROOT
    package_path: src/antibioticmech
    schema_paths:
      - src/antibioticmech/schema/antibioticmech.yaml
    record_globs:
      - data/antibiotics/**/*.yaml
    vendored_role: consumer
    capabilities:
      # These arrive with the vendoring PR this declaration obliges
      # (AntibioticMech#29). Enabled rather than disabled-with-an-absent-claim
      # (#255): a claim that the files are absent is true only until that lands,
      # and the fleet audit reports the real gap either way.
      id_label_validation:
        status: enabled
      curation_history:
        status: enabled
      vendored_sync:
        status: enabled
      # `validate-strict`, `test`, `lint`, `gen-schema` and `qc` are all
      # recipes in this repository's justfile, and main.yaml runs qc on 3.10
      # and 3.12.
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      testing:
        status: enabled
      documentation:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: disabled
        reason: >-
          Has research-antibiotic, research-entity and deep-research-canary
          recipes and a research/ tree, but no conf/deep_research_provider.yaml
          -- the profile every deep-research Mech declares and the contract
          resolves. Enabled on the recipes alone this would assert a profile
          that does not exist; the recipes are a research route, not the
          declared provider contract.
        reason_claims:
          present:
            - research
          absent:
            - conf/deep_research_provider.yaml
      edison_key_discovery:
        status: not_applicable
        reason: >-
          Research runs through this repository's own research-antibiotic and
          research-entity recipes; it uses no Edison provider key.
      environment_coverage:
        status: not_applicable
        reason: >-
          Environment coverage compares culture media, ingredients and
          microbial communities. An antimicrobial-compound corpus is not an
          environment inventory input.
      unmapped_inventory_input:
        status: not_applicable
        reason: >-
          The unmapped inventory reconciles ingredient names across media
          corpora; antimicrobial compounds are not one of its sources.
      knowledge_gap_scan:
        status: disabled
        reason: >-
          Records do not carry the shared Discussion section the scan reads,
          and this repository is not in the knowledge-gap-scan workflow matrix.
          Enable once records carry it.
      source_catalogue:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - antimicrobial_class
            - grounding_status
      source_queue:
        status: enabled
        settings:
          queue_path: curation/source_queue.tsv
      site_contract:
        status: enabled
        settings:
          site_path: pages
      page_budgets:
        status: disabled
        reason: >-
          Serves tracked pages under pages/ from main via GitHub Pages and
          declares no size or file-count budgets, so nothing watches them grow
          -- 2,956 files and 30.1 MB measured at admission (#230). Adopting them
          applies here; the limits are this repository's to set.
        reason_claims:
          present:
            - pages
      writer_audit:
        status: disabled
        reason: >-
          Has no scripts/audit_writers.py, so there is no drift between writer
          copies to remove yet. Adopting it applies once more writers exist.
        reason_claims:
          absent:
            - scripts/audit_writers.py
      sssom_export:
        status: disabled
        reason: >-
          Records carry ChEBI and ARO identifiers inline rather than through a
          mapping file. Adopting SSSOM applies once a mapping product exists.
      kgx_export:
        status: disabled
        reason: >-
          No exporter and no graph product yet; adopting KGX applies once the
          corpus is consumed as a graph.
    # Measured, not copied (#187): PyYAML's default width round-trips this
    # corpus byte-for-byte over ALL 2,909 records, not a sample. Widths 100,
    # 120 and 4096 score 8%, 8% and 7%, so the value is the corpus's, not a
    # convention borrowed from a sibling.
    serialization:
      verified: true
      options:
        default_flow_style: false
        sort_keys: false
        allow_unicode: true
        width: 80
  cellstructuremech:
    # Joined 2026-08-30 (CellStructureMech#47). Capability decisions below were
    # measured against the repository's tracked files at that date; every
    # disabled/not_applicable status names the issue that would flip it.
    display_name: CellStructureMech
    github: CultureBotAI/CellStructureMech
    environment_variable: CELLSTRUCTUREMECH_ROOT
    package_path: src/cellstructuremech
    schema_paths:
      - src/cellstructuremech/schema/cellstructuremech.yaml
    record_globs:
      - data/structures/**/*.yaml
    vendored_role: consumer
    capabilities:
      # Enabled rather than disabled-with-an-absent-claim (#255): both arrive in
      # CellStructureMech#53, which is open and green, so a claim that the files
      # are absent is true only until that merges. An enabled declaration carries
      # no claim to falsify and lets the fleet audit report the real gap, which
      # is the same choice vendored_sync makes below.
      id_label_validation:
        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: disabled
        reason: >-
          Research so far is source assessment written by hand under research/
          with no provider client or research recipe in the justfile; the
          repository has not decided on a paid research route.
        reason_claims:
          present:
            - research
      edison_key_discovery:
        status: not_applicable
        reason: >-
          CellStructureMech does not use an Edison research-provider key; it has
          no research provider integration at all.
      environment_coverage:
        status: not_applicable
        reason: >-
          Environment coverage currently compares culture media, ingredients,
          and microbial communities; cell-structure records are not an
          environment inventory input.
      knowledge_gap_scan:
        status: disabled
        reason: >-
          Records carry the shared Discussion section, so the scan applies, but
          the corpus is four records and the repository is not yet in the
          knowledge-gap-scan workflow matrix; enable once the first tranche of
          records lands (CellStructureMech#12).
      # An authoritative consumer must sync; the loader rejects anything else.
      # CellStructureMech#48 vendors the artifact set and pin that this
      # declaration obliges; until it lands, the fleet audit reports the gap.
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - structure_category
            - mapping_status
      page_budgets:
        status: disabled
        reason: >-
          Serves tracked pages under pages/ straight from main via GitHub Pages
          -- it has no generate-pages.yaml -- and declares no size or
          file-count budgets, so nothing watches them grow. Adopting them
          applies here; the limits are the repository's to set.
        reason_claims:
          present:
            - pages
          absent:
            - .github/workflows/generate-pages.yaml
      writer_audit:
        status: disabled
        reason: >-
          Has no scripts/audit_writers.py, so there is no drift to remove yet.
          Adopting it applies here once the corpus grows; the settings are the
          repository's to declare.
        reason_claims:
          absent:
            - scripts/audit_writers.py
      sssom_export:
        status: disabled
        reason: >-
          Records carry GO cellular-component identifiers inline rather than
          through a mapping file, and the corpus is four records. Adopting one
          applies once it grows.
      kgx_export:
        status: disabled
        reason: >-
          Four structure records and no exporter; adopting KGX applies once the
          corpus grows.
      source_queue:
        status: enabled
        settings:
          queue_path: curation/source_queue.tsv
          extensions: [taxon_link, item_id, script]
          required_when_adopted: [script]
      site_contract:
        status: enabled
        settings:
          site_path: pages
      source_catalogue:
        status: disabled
        reason: >-
          The repository keeps its ranked source list as
          curation/source_queue.tsv, machine-checked by
          scripts/check_source_queue.py inside its qc gate, rather than a
          download.yaml in the fleet's catalogue shape; there is no
          download.yaml to parse. Converging on one shape is open.
        reason_claims:
          present:
            - curation/source_queue.tsv
            - scripts/check_source_queue.py
          absent:
            - download.yaml
      unmapped_inventory_input:
        status: not_applicable
        reason: >-
          The unmapped-ingredient inventory reads culture-media and
          ingredient corpora; CellStructureMech curates cell structures and
          has no ingredient records, so scripts/inventory_unmapped_ingredients.py
          defines no loader for it.
        reason_claims:
          present:
            - claw:scripts/inventory_unmapped_ingredients.py
    serialization:
      verified: true
      options:
        default_flow_style: false
        sort_keys: false
        allow_unicode: true
        width: 80
