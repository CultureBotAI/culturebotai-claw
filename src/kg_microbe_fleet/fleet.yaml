      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - taxon_domain
            - rank
            - grounding_status
            - mapping_status
      causal_graph_coverage:
        # Higher taxa are never records, so the general-parent case does not
        # arise. The seeder owns every record and writes no graph, so coverage
        # is zero until the curator overlay the seeder would merge exists.
        # The nine metagenome / uncultured / unidentified records (domain
        # OTHER) are counted, not exempt: TaxonMech has not said they take no
