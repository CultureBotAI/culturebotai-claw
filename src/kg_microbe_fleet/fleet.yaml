        Taxon records are generated from committed inventories and scope;
        generic serialization must not bypass the native seeder and corpus
        reproduction gate.
    capabilities:
      evidence_reference_validation:
        status: disabled
        reason: >-
          Measured 2026-11-04 (claw#729): none of the 306 evidence items carries a
          quote, so the gate would check nothing. The native EvidenceItem allows
          optional verbatim snippets; enable once quoted literature evidence exists.
      id_label_validation:
        status: enabled
      record_review:
        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      # These declare eligibility for shared orchestration, as for the other
