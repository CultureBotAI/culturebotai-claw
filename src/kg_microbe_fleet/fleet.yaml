# Canonical fleet manifest.
#
# This file is the single source of truth for which repositories constitute the
# Mech fleet. Before it existed, at least three independent lists disagreed:
# `plugins/repository_settings.py` and `cli/main.py` knew three Mechs, the
# cross-mech-sync skill knew four, and `scripts/fleet_pr_status.py` knew five.
# Every fleet-facing component must derive its repository list from here rather
# than re-declaring one. The manifest, agent, workflow, script, and general-skill
# contract tests enforce the supported consumer set and check that packaged
# configuration and `.env.example` agree. Domain-specific pipelines may name
# scientific inputs, but those names never redefine fleet membership.
#
# Package, schema, and record paths below were checked against each local Mech
# checkout on 2026-08-25. They are repository-relative POSIX paths so consumers
# never need to infer a sibling-checkout layout.

version: 1

# Canonical capability catalogue. Every Mech must declare every key exactly
# once. The loader rejects omissions and unknown keys, so an absent declaration
# can never silently mean "off". Status is one of enabled / disabled /
# not_applicable; the latter two require a reason.
capability_catalogue:
  id_label_validation: {}
  curation_history: {}
  record_review: {}
  strict_validation: {}
  schema_sync: {}
  release_management: {}
  build_coordination: {}
  documentation: {}
  testing: {}
  refactoring: {}
  coordination_hooks: {}
  deep_research: {}
  edison_key_discovery: {}
  environment_coverage:
    settings:
      record_globs:
        type: string_list
        required_when_enabled: true
  knowledge_gap_scan:
    settings:
      # Native offline adapters can require retained input instead of live API queries.
      # Omitted preserves existing scheduling; false excludes the nightly live matrix.
      scheduled:
        type: boolean
      window:
        type: integer
        required_when_enabled: true
        minimum: 1
  vendored_sync: {}
  unmapped_inventory_input: {}
  source_catalogue: {}
  # Cached-source quote matching is independent of citation/field presence.
  # Domain/source adapters must be reviewed before enabling another Mech.
  evidence_reference_validation:
    settings:
      cache_dir:
        type: string
        required_when_enabled: true
      reference_fields:
        type: string_list
      snippet_fields:
        type: string_list
      evidence_fields:
        type: string_list
      evidence_paths:
        type: string_list
      # Issue-owned findings that are reported but do not block (#729).
      known_findings:
        type: string
  corpus_statistics:
    settings:
      fields:
        type: string_list
        required_when_enabled: true
  # What fraction of records carry a causal graph, which are declared not to
  # need one, how many graphs each has, and their structure
  # (kg-microbe-graph coverage). Applicability is never inferred: a record
  # leaves the denominator only through an exempt_when rule declared here,
  # because "parents and habitats need no graph" is false in several Mechs.
  # Combinations that are invalid together are rejected by
  # kg_microbe_graph.coverage.CoverageConfig, and a test applies it to every
  # enabled declaration.
  causal_graph_coverage:
    settings:
      # graph_list (a record holds a list of graphs) or node_nested_edges
      # (the record is one graph; each node lists its outgoing edges).
      graph_shape:
        type: string
        required_when_enabled: true
      graphs_field:
        type: string
      graph_id_field:
        type: string
      nodes_field:
        type: string
      edges_field:
        type: string
      node_id_field:
        type: string
      node_type_field:
        type: string
      node_grounding_field:
        type: string
      edge_subject_field:
        type: string
      edge_object_field:
        type: string
      edge_predicate_field:
        type: string
      edge_evidence_field:
        type: string
      # The record's own id, to count graphless records grounded inside
      # another record's graph.
      record_id_field:
        type: string
      # A per-graph disposition, and which of its values count as a mechanism.
      scope_field:
        type: string
      mechanistic_scopes:
        type: string_list
      # Per-graph fields whose per-record combinations are tabulated.
      graph_facets:
        type: string_list
      anchor_node_types:
        type: string_list
      duplicate_grounding_check:
        type: boolean
      # field=A|B, field~REGEX, or path:GLOB. First match is credited.
      exempt_when:
        type: string_list
      # Record fields (or @directory) to break every count down by.
      strata:
        type: string_list
  page_budgets:
    settings:
      site_path:
        type: string
        required_when_enabled: true
      budgets_path:
        type: string
        required_when_enabled: true
  kgx_export:
    settings:
      nodes_path:
        type: string
        required_when_enabled: true
      edges_path:
        type: string
        required_when_enabled: true
      extra_prefixes:
        type: string_list
  source_queue:
    settings:
      queue_path:
        type: string
        required_when_enabled: true
      extensions:
        type: string_list
      required_when_adopted:
        type: string_list
  metpo_proposal:
    settings:
      class_glob:
        type: string
        required_when_enabled: true
      property_glob:
        type: string
  sssom_export:
    settings:
      mapping_globs:
        type: string_list
        required_when_enabled: true
      extensions:
        type: string_list
  writer_audit:
    settings:
      search_dirs:
        type: string_list
        required_when_enabled: true
      save_helpers:
        type: string_list
      validators:
        type: string_list
      curation_markers:
        type: string_list
      exclude:
        type: string_list
  site_contract:
    settings:
      site_path:
        type: string
        required_when_enabled: true
      # What a site-absolute reference means, and how far a relative one may
      # climb. Defaults to site_path; they differ when a repository checks part
      # of what it publishes (#238).
      published_root:
        type: string
      allowed_hosts:
        type: string_list

# Vendored shared-file governance is deliberately modeled separately from
# fleet membership: claw is the external authority and must never pin itself.
# The coordinated Phase 1 migration is complete. `transition` remains a
# validated compatibility state for older manifests, but the shipped state is
# `authoritative`: there is no Mech hub, and every Mech is a pinned consumer of
# claw. The loader rejects mixed authoritative state.
vendored_governance:
  state: authoritative
  canonical_repository: CultureBotAI/culturebotai-claw
  manifest_path: src/kg_microbe_governance/vendored_artifacts.json
  pin_path: scripts/.vendored_canon_ref

mechs:
  culturemech:
    display_name: CultureMech
    github: CultureBotAI/CultureMech
    environment_variable: CULTUREMECH_ROOT
    package_path: src/culturemech
    schema_paths:
      - src/culturemech/schema/culturemech.yaml
    record_globs:
      - data/merge_yaml/merged/*.yaml
    vendored_role: consumer
    capabilities:
      evidence_reference_validation:
        status: disabled
        reason: >-
          Measured 2026-11-04 (claw#729): the record_globs name the derived
          merged layer, whose 91 quote-bearing items are stale, while the
          authoritative normalized corpus holds 38,580, of which 37,626 (97.5%)
          cite neither a PMID nor a DOI. Adoption needs the gate to read the
          authoritative layer (claw#779) and a source adapter for web and
          database citations.
      id_label_validation:
        status: enabled
      record_review:
        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: enabled
      edison_key_discovery:
        status: enabled
      environment_coverage:
        status: enabled
        settings:
          record_globs:
            - data/merge_yaml/merged/*.yaml
      knowledge_gap_scan:
        status: enabled
        settings:
          window: 300
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - source_environment
            - medium_type
      causal_graph_coverage:
        status: not_applicable
        reason: >-
          MediaRecipe records are compositions. The schema has no causal-graph
          slot and no record carries graph-shaped content; what CultureMech's
          own tooling calls causal-graph coverage (#468) is its review-need
          score over recipe grounding, not a graph.
      page_budgets:
        status: disabled
        reason: >-
          Generates a site through .github/workflows/generate-pages.yaml but
          declares no size or file-count budgets, so nothing watches it grow.
          Adopting them applies here; the limits are the repository's to set.
        reason_claims:
          present:
            - .github/workflows/generate-pages.yaml
      writer_audit:
        status: enabled
        settings:
          search_dirs: [scripts, src/culturemech]
          save_helpers: [write_validated_recipe]
          exclude: [scripts/audit_writers.py]
      sssom_export:
        status: enabled
        settings:
          mapping_globs: ["output/*.sssom.tsv"]
          extensions: [mapping_method]
      metpo_proposal:
        status: disabled
        reason: >-
          Carries .claude/commands/ground-or-propose-metpo.md, so the grounding
          half is present, but has no proposals/ directory and has never minted
          a METPO id. Adopting applies once a CultureMech term needs one.
        reason_claims:
          absent: ["proposals"]
          present: [".claude/commands/ground-or-propose-metpo.md"]
      kgx_export:
        status: disabled
        reason: >-
          scripts/export_kgx.py writes to output/kgx but has produced nothing
          tracked, so there is no graph for this contract to judge. KGX export
          applies here, as to every Mech (#503); adoption is pending
          (CultureMech#490): run the exporter and declare its nodes and edges.
        reason_claims:
          present:
            - scripts/export_kgx.py
          absent:
            - output/kgx
      source_queue:
        status: disabled
        reason: >-
          Has no curation/source_queue.tsv. AntibioticMech wrote the pattern and
          CellStructureMech adapted it; adopting it here means ranking this
          corpus's own candidate sources and verifying their licences, which is
          curation work rather than a file copy.
        reason_claims:
          absent:
            - curation/source_queue.tsv
      site_contract:
        status: disabled
        reason: >-
          Publishes a site built in CI, so no directory in the checkout is the
          output the check would judge; running it on the Jekyll or template
          sources reports missing .html files that the build creates. Adopting
          it means running the check on the build product, which applies here
          and is not yet wired.
      source_catalogue:
        status: disabled
        reason: >-
          Fetches each source from its own script --
          scripts/fetch_komodo_base_volumes.py,
          scripts/fetch_mediadive_solution_volumes.py,
          scripts/fetch_pubmed_abstracts.py -- with no download.yaml declaring
          them, so there is no catalogue to validate. Adopting one would apply
          here; it has not been written.
        reason_claims:
          present:
            - scripts/fetch_komodo_base_volumes.py
            - scripts/fetch_mediadive_solution_volumes.py
            - scripts/fetch_pubmed_abstracts.py
          absent:
            - download.yaml
      unmapped_inventory_input:
        status: enabled
    serialization:
      verified: true
      options:
        default_flow_style: false
        sort_keys: false
        allow_unicode: true
        width: 80

  mediaingredientmech:
    display_name: MediaIngredientMech
    github: CultureBotAI/MediaIngredientMech
    environment_variable: MEDIAINGREDIENTMECH_ROOT
    package_path: src/mediaingredientmech
    schema_paths:
      - src/mediaingredientmech/schema/mediaingredientmech.yaml
    record_globs:
      - data/ingredients/**/*.yaml
    vendored_role: consumer
    capabilities:
      evidence_reference_validation:
        status: enabled
        settings:
          cache_dir: references_cache
          reference_fields: [pmid, doi, reference]
          snippet_fields: [snippet, excerpt, supporting_text]
          evidence_fields: [evidence]
          # Preserve the existing gate's scope. The two role selectors are
          # legacy names; current role facets need their own reviewed adapter.
          evidence_paths:
            - ontology_mapping.evidence
            - role_assignments[].evidence
            - cellular_role_assignments[].evidence
      id_label_validation:
        status: enabled
      record_review:
        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: enabled
      edison_key_discovery:
        status: enabled
      environment_coverage:
        status: enabled
        settings:
          record_globs:
            - data/ingredients/**/*.yaml
      knowledge_gap_scan:
        status: enabled
        settings:
          window: 300
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - ingredient_type
            - ontology_mapping.mapping_quality
      causal_graph_coverage:
        status: disabled
        reason: >-
          IngredientRecord has no causal-graph slot. Its role facets and
          components are typed assertions around one ingredient, a star with
          nothing to connect, and scripts/score_causal_graph_readiness.py ranks
          their readiness to seed a graph. Enable once records carry graphs.
        reason_claims:
          present: ["scripts/score_causal_graph_readiness.py"]
      page_budgets:
        status: disabled
        reason: >-
          Generates a site through .github/workflows/generate-pages.yaml but
          declares no size or file-count budgets, so nothing watches it grow.
          Adopting them applies here; the limits are the repository's to set.
        reason_claims:
          present:
            - .github/workflows/generate-pages.yaml
      writer_audit:
        status: enabled
        settings:
          search_dirs: [scripts, src/mediaingredientmech]
          save_helpers: [save_yaml, write_validated_ingredient]
          exclude: [scripts/audit_writers.py]
      sssom_export:
        status: enabled
        settings:
          mapping_globs: ["mappings/*.sssom.tsv"]
          extensions: [source, validation_method]
      metpo_proposal:
        status: not_applicable
        reason: >-
          MIM grounds ingredients in ChEBI and FOODON and publishes SSSOM
          mappings; METPO models microbial phenotypes and processes, which is
          not the axis this corpus curates.
      kgx_export:
        status: disabled
        reason: >-
          Builds a KGX ingredient graph with
          src/mediaingredientmech/export/kgx.py. Its one KGX release,
          mim-supported-2026-09-21, is a snapshot its own notes mark superseded,
          with a new KGX publication pending, and it declares no nodes and
          edges for this contract to judge. KGX export applies here, as to
          every Mech (#503); adoption is pending (MediaIngredientMech#778).
        reason_claims:
          present:
            - src/mediaingredientmech/export/kgx.py
      source_queue:
        status: disabled
        reason: >-
          Has no curation/source_queue.tsv. AntibioticMech wrote the pattern and
          CellStructureMech adapted it; adopting it here means ranking this
          corpus's own candidate sources and verifying their licences, which is
          curation work rather than a file copy.
        reason_claims:
          absent:
            - curation/source_queue.tsv
      site_contract:
        status: disabled
        reason: >-
          Publishes a site built in CI, so no directory in the checkout is the
          output the check would judge; running it on the Jekyll or template
          sources reports missing .html files that the build creates. Adopting
          it means running the check on the build product, which applies here
          and is not yet wired.
      source_catalogue:
        status: disabled
        reason: >-
          Fetches ontologies through download_ontologies.py rather than a
          declared catalogue, so there is no download.yaml to validate.
          Adopting one would apply here; it has not been written.
        reason_claims:
          present:
            - scripts/download_ontologies.py
          absent:
            - download.yaml
      unmapped_inventory_input:
        status: enabled
    serialization:
      verified: true
      options:
        default_flow_style: false
        sort_keys: false
        allow_unicode: true
        width: 80

  communitymech:
    display_name: CommunityMech
    github: CultureBotAI/CommunityMech
    environment_variable: COMMUNITYMECH_ROOT
    package_path: src/communitymech
    schema_paths:
      - src/communitymech/schema/communitymech.yaml
    record_globs:
      - kb/communities/*.yaml
      - data/isolates/*.yaml
    vendored_role: consumer
    capabilities:
      evidence_reference_validation:
        status: disabled
        reason: >-
          Measured 2026-11-04 (claw#729): of 8,360 PMID-cited quotes, 4,629 occur
          in the cited abstract and 3,727 do not; 2,509 of those occur in the
          Mech's tracked PMID text caches, which hold full texts and longer
          abstract exports. The 1,232 DOI- and web-cited quotes were not compared.
          Adoption needs a reviewed source adapter for those texts and the native
          front-matter caches; the native evidence-repair backlog remains open.
      id_label_validation:
        status: enabled
      record_review:
        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: enabled
      edison_key_discovery:
        status: enabled
      environment_coverage:
        status: enabled
        settings:
          # Preserve the dashboard's original isolate-inventory scope. General
          # CommunityMech consumers may also use kb/communities/*.yaml.
          record_globs:
            - data/isolates/*.yaml
      knowledge_gap_scan:
        status: enabled
        settings:
          window: 305
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - environment_term
      causal_graph_coverage:
        # The graph is implicit: interactions are the nodes and each lists the
        # interactions it feeds as downstream, so a record is one graph and an
        # interaction with no downstream edge asserts no causal link. Edges
        # carry only a description (evidence sits on the interaction), so edge
        # evidence is not declared and not measured. No field exempts a
        # community, and directed cycles are intended (syntrophic loops).
        status: enabled
        settings:
          graph_shape: node_nested_edges
          nodes_field: ecological_interactions
          node_id_field: name
          node_type_field: interaction_type
          edges_field: downstream
          edge_object_field: target
          strata:
            - community_origin
            - "@directory"
      page_budgets:
        status: disabled
        reason: >-
          Generates a site through .github/workflows/generate-pages.yaml but
          declares no size or file-count budgets, so nothing watches it grow.
          Adopting them applies here; the limits are the repository's to set.
        reason_claims:
          present:
            - .github/workflows/generate-pages.yaml
      writer_audit:
        status: enabled
        settings:
          search_dirs: [scripts, src/communitymech]
          save_helpers: [write_validated_community]
          curation_markers: [record_curation_event]
          exclude: [scripts/audit_writers.py]
      sssom_export:
        status: disabled
        reason: >-
          Keeps its term groundings, with SKOS predicates, in
          mappings/community_term_grounding.tsv rather than as SSSOM, so there
          is no SSSOM file for this contract to judge. SSSOM export applies
          here, as to every Mech (#503); adoption is pending
          (CommunityMech#1137).
        reason_claims:
          present:
            - mappings/community_term_grounding.tsv
      metpo_proposal:
        status: enabled
        settings:
          class_glob: "proposals/*/metpo_proposal_classes_robot.tsv"
          property_glob: "proposals/*/metpo_proposal_properties_robot.tsv"
      kgx_export:
        status: enabled
        settings:
          nodes_path: output/kgx/nodes.tsv
          edges_path: output/kgx/edges.tsv
      source_queue:
        status: disabled
        reason: >-
          Has no curation/source_queue.tsv. AntibioticMech wrote the pattern and
          CellStructureMech adapted it; adopting it here means ranking this
          corpus's own candidate sources and verifying their licences, which is
          curation work rather than a file copy.
        reason_claims:
          absent:
            - curation/source_queue.tsv
      site_contract:
        status: enabled
        settings:
          site_path: docs
      source_catalogue:
        status: disabled
        reason: >-
          Has no download.yaml; its inputs arrive through per-source scripts
          rather than a declared catalogue. Adopting one would apply here;
          it has not been written.
        reason_claims:
          absent:
            - download.yaml
      unmapped_inventory_input:
        status: enabled
    serialization:
      verified: false
      reason: >-
        No PyYAML option set reproduces this corpus, so there is no
        correct value to declare and writing a record back would
        reformat it. Measured in #187.

  traitmech:
    display_name: TraitMech
    github: CultureBotAI/TraitMech
    environment_variable: TRAITMECH_ROOT
    package_path: src/traitmech
    schema_paths:
      - src/traitmech/schema/traitmech.yaml
    record_globs:
      - data/traits/**/*.yaml
    vendored_role: consumer
    capabilities:
      evidence_reference_validation:
        status: disabled
        reason: >-
          Measured 2026-11-04 (claw#729): of 9,775 quotes, 283 cite a PMID, 5,717
          a DOI, 933 a journal supplement or article full text, and 2,842 a web or
          database source (mostly model files and a wiki). Adoption needs a
          measurement of the DOI-cited quotes, a full-text and supplement source
          adapter, and a quote-versus-database-assertion adapter.
      id_label_validation:
        status: enabled
      record_review:
        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: enabled
      edison_key_discovery:
        status: enabled
      environment_coverage:
        status: not_applicable
        reason: >-
          Environment coverage currently compares culture media, ingredients,
          and microbial communities; trait records are not an environment
          inventory input.
      knowledge_gap_scan:
        status: enabled
        settings:
          window: 300
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - mapping_status
            - trait_category
      causal_graph_coverage:
        # NONMECHANISTIC means "a mechanism does not apply" on REVIEWED records
        # and "deferred" on PROPOSED genomics systems, so it is reported as its
        # own count, and mapping_status is a stratum to tell the two apart.
        # Habitat-like ECOLOGY traits are not exempt: they carry graphs.
        status: enabled
        settings:
          graph_shape: graph_list
          record_id_field: identifier
          scope_field: scope_status
          mechanistic_scopes: [MECHANISTIC]
          anchor_node_types: [TRAIT]
          duplicate_grounding_check: true
          exempt_when:
            # README: the deprecated records "are not intended to carry
            # mechanism graphs in TraitMech".
            - "mapping_status=DEPRECATED"
            # CURATION_PLAYBOOK: "Skip causal graphs entirely when" the record
            # is a relation carrier -- "predicates, not phenotypes".
            - "term_kind=OBJECT_PROPERTY|DATATYPE_PROPERTY"
            # trait_priority: upper-ontology classifiers are non_mechanism.
            - "trait_category=UPPER"
          strata:
            - mapping_status
            - trait_category
      page_budgets:
        status: disabled
        reason: >-
          Serves its tracked pages under pages/ straight from main via GitHub
          Pages -- it has no generate-pages.yaml, unlike the other four -- and
          declares no size or file-count budgets, so nothing watches them grow.
          Adopting them applies here; the limits are the repository's to set.
        reason_claims:
          present:
            - pages
          absent:
            - .github/workflows/generate-pages.yaml
      writer_audit:
        status: enabled
        settings:
          search_dirs: [scripts, src/traitmech]
          save_helpers: [write_validated_trait]
          curation_markers: [record_curation]
          exclude: [scripts/audit_writers.py]
      sssom_export:
        status: enabled
        settings:
          mapping_globs: ["proposals/*/metpo_proposal_mappings.sssom.tsv"]
      metpo_proposal:
        status: enabled
        settings:
          class_glob: "proposals/*/metpo_proposal_classes_robot.tsv"
          property_glob: "proposals/*/metpo_proposal_properties_robot.tsv"
      kgx_export:
        status: disabled
        reason: >-
          Publishes trait records and METPO mapping proposals, not yet a KGX
          graph. KGX export applies here, as to every Mech (#503); adoption is
          pending (TraitMech#1331).
      source_queue:
        status: disabled
        reason: >-
