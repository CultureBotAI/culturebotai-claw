    environment_variable: CMMMECH_ROOT
    package_path: src/cmmmech
    schema_paths:
      - src/cmmmech/schema/cmmmech.yaml
    record_globs:
      - data/records/**/*.yaml
      - data/records/**/*.yml
    vendored_role: consumer
    serialization:
      verified: false
      reason: >-
        Material records exist, but shared round-trip options have not been
        verified against the native validation and authoring contract.
    capabilities:
      evidence_reference_validation:
        status: disabled
        reason: >-
          Measured 2026-11-04 (claw#729): none of the 3,526 evidence items carries
          a quote; native MechanismEvidence (source_ref, supports, explanation) has
          no verbatim-quote slot, so the gate would check nothing. Adoption needs
          that slot filled with verbatim quotes, and either a PMID or DOI on each
          evidence item or a reviewed adapter that resolves source_ref through the
          record's sources list.
      id_label_validation:
        status: disabled
        reason: >-
          The native validator checks identifier syntax, not ontology correspondence.
          No conf/id_label_targets.yaml configures the shared correspondence gate.
        reason_claims:
          absent: ["conf/id_label_targets.yaml"]
      record_review:
        status: enabled
      curation_history:
        status: disabled
        reason: >-
          Native inline events and canonical sidecars are implemented through
          src/cmmmech/history.py and justfile, with history/ validated as append-only
          in CI. .claude/skills/curate-yaml-record/SKILL.md and
          .claude/skills/curate-yaml-record/references/review-checklist.md now exist,
          added with CMMMech's canonical skill adapters (CMMMech#513), so the
          write contract's files are present; enabling generic curation awaits
          review (#1059). Read-only structured review has its own record_review
          capability and does not enable curation.
        reason_claims:
          present:
            - "justfile"
            - "src/cmmmech/history.py"
            - "history"
            - ".claude/skills/curate-yaml-record/SKILL.md"
            - ".claude/skills/curate-yaml-record/references/review-checklist.md"
      strict_validation:
        status: disabled
        reason: >-
          Native closed-schema validation runs through scripts/check.py and
          justfile's check and validate recipes. The fleet validation agent's
          validate-all, validate-schema and validate-data recipes are not yet
          implemented or adapted; native CI passing does not establish that contract.
        reason_claims:
          present: ["scripts/check.py", "justfile"]
      schema_sync:
        status: disabled
        reason: >-
          src/cmmmech/schema/cmmmech.yaml is packaged and consumed at runtime
          by src/cmmmech/validation.py. No generated-datamodel adapter or
          schema regeneration recipes in justfile have been verified for fleet use.
        reason_claims:
          present: ["src/cmmmech/schema/cmmmech.yaml", "src/cmmmech/validation.py", "justfile"]
      # General orchestration eligibility does not claim installed downstream hooks.
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: disabled
        reason: >-
          No conf/deep_research_provider.yaml configures a provider exercising
          the shared research contract.
        reason_claims:
          absent: ["conf/deep_research_provider.yaml"]
      edison_key_discovery:
        status: not_applicable
        reason: CMMMech has no Edison research-provider integration.
      environment_coverage:
        status: not_applicable
        reason: Materials and recovery mechanisms are not an environment inventory.
      knowledge_gap_scan:
        status: disabled
        reason: >-
          No conf/kgscan_config.yaml configures the discussion scanner;
          the native schema does not yet model curated Discussions.
        reason_claims:
          absent: ["conf/kgscan_config.yaml"]
      # Required consumer contract, enforced against the published canonical pin.
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: disabled
        reason: >-
          Material records exist, but no verified field selection configures
          the shared corpus-statistics adapter.
      causal_graph_coverage:
        status: disabled
        reason: Mechanism evidence is modeled without nodes or directed causal edges.
      page_budgets:
        status: disabled
        reason: A pages/ tree exists, but no conf/pages_budgets.json declares its budgets.
        reason_claims:
          present: ["pages"]
          absent: ["conf/pages_budgets.json"]
      kgx_export:
        status: disabled
        reason: No curated graph or KGX export product exists yet.
      source_queue:
        status: disabled
        reason: No curation/source_queue.tsv records ranked sources and adoption decisions.
        reason_claims:
          absent: ["curation/source_queue.tsv"]
      metpo_proposal:
        status: disabled
        reason: No proposals/ directory exists for terms under the METPO proposal contract.
        reason_claims:
          absent: ["proposals"]
      sssom_export:
        status: disabled
        reason: No SSSOM mapping product exists yet.
      writer_audit:
        status: disabled
        reason: >-
          The native CLI only reads records; no scripts/audit_writers.py
