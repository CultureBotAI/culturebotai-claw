        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: enabled
      edison_key_discovery:
        status: enabled
      environment_coverage:
        status: enabled
        settings:
          record_globs:
            - data/ingredients/**/*.yaml
      knowledge_gap_scan:
        status: enabled
        settings:
          window: 300
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - ingredient_type
