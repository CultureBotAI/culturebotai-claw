          window: 25
          scheduled: false
      # All 18 applicable artifacts are committed at canonical pin 59aead1.
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          # Seed census only. Optional assertions/discussions remain zero in
          # the native census, rather than implying scientific completeness.
          fields: [id, name, seed_status, characterization_status, curation_status, provenance]
      page_budgets:
        status: enabled
        settings:
          site_path: pages
          budgets_path: conf/pages_budgets.json
      kgx_export:
        status: enabled
        settings:
          nodes_path: exports/kgx/nodes.tsv
          edges_path: exports/kgx/edges.tsv
      writer_audit:
        status: enabled
        settings:
          # Availability of this heuristic is not complete guarded-write proof.
          # Native conf/writer_audit.yaml covers multiple formats. Module-based
          # just recipes are not recognized by the shared filename heuristic.
          search_dirs: [src/dufmech, scripts]
          save_helpers: [write_records, new_history]
          validators: ['validate_record\(', '_validate_record\(', '_validate_content\(']
          # Generated projections validate existing history, not new events.
          curation_markers: ['new_history\(']
      sssom_export:
        status: enabled
        settings:
          mapping_globs: [exports/sssom/*.sssom.tsv]
      metpo_proposal:
        status: disabled
        reason: >-
          No proposals/ directory exists. Enable when family mechanisms need
          new METPO terms and the repository adopts the proposal contract.
        reason_claims:
          absent: ["proposals"]
      source_queue:
        status: enabled
        settings:
          queue_path: curation/source_queue.tsv
          extensions: [implementation, reviewed_on, review_basis, script, artifacts, license_url]
          required_when_adopted: [script, artifacts, license_url, review_basis]
      site_contract:
        status: enabled
        settings:
          site_path: pages
      source_catalogue:
        status: enabled
      unmapped_inventory_input:
        status: not_applicable
        reason: Protein-family evidence is not a culture-medium ingredient corpus.
      causal_graph_coverage:
        status: disabled
        reason: >-
          The schema supports scientific assertions, but the seeded corpus has
          no curated mechanistic assertions or adopted causal-graph projection
          in a supported shared coverage shape.

  cmmmech:
    # Inspected main c32d78e26a15bb67a737700668badaed7da10597 on admission.
