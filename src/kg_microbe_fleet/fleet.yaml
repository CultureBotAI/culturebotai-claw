          declares no size or file-count budgets, so nothing watches them grow.
          Adopting them applies here; the limits are the repository's to set.
        reason_claims:
          present:
            - pages
          absent:
            - .github/workflows/generate-pages.yaml
      writer_audit:
        status: enabled
        settings:
          search_dirs: [scripts, src/traitmech]
          save_helpers: [write_validated_trait]
          curation_markers: [record_curation]
          exclude: [scripts/audit_writers.py]
      sssom_export:
        status: enabled
        settings:
          mapping_globs: ["proposals/*/metpo_proposal_mappings.sssom.tsv"]
      kgx_export:
        status: disabled
        reason: >-
          Publishes trait records and METPO mapping proposals, not a KGX graph.
      source_queue:
        status: disabled
        reason: >-
          Has no curation/source_queue.tsv. AntibioticMech wrote the pattern and
          CellStructureMech adapted it; adopting it here means ranking this
          corpus's own candidate sources and verifying their licences, which is
          curation work rather than a file copy.
        reason_claims:
          absent:
            - curation/source_queue.tsv
      site_contract:
        status: enabled
        settings:
          site_path: pages
          # GitHub Pages serves this repository from main at /, so the whole
          # checkout is published even though only pages/ is checked. Ten trait
          # pages link ../../../app/discussions/, which is served and would
          # otherwise read as climbing out of the site.
          published_root: .
          allowed_hosts:
            - cdn.jsdelivr.net
      source_catalogue:
        status: enabled
      unmapped_inventory_input:
        status: not_applicable
        reason: >-
          The unmapped-ingredient inventory reads culture-media and
          ingredient corpora; TraitMech curates traits and has no
          ingredient records, so scripts/inventory_unmapped_ingredients.py
          defines no loader for it.
        reason_claims:
          present:
            - claw:scripts/inventory_unmapped_ingredients.py
    serialization:
      verified: true
      options:
        default_flow_style: false
        sort_keys: false
        allow_unicode: true
        width: 80

