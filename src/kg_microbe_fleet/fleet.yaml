# Canonical fleet manifest.
#
# This file is the single source of truth for which repositories constitute the
# Mech fleet. Before it existed, at least three independent lists disagreed:
# `plugins/repository_settings.py` and `cli/main.py` knew three Mechs, the
# cross-mech-sync skill knew four, and `scripts/fleet_pr_status.py` knew five.
# Every fleet-facing component must derive its repository list from here rather
# than re-declaring one. The manifest, agent, workflow, script, and general-skill
# contract tests enforce the supported consumer set and check that packaged
# configuration and `.env.example` agree. Domain-specific pipelines may name
# scientific inputs, but those names never redefine fleet membership.
#
# Package, schema, and record paths below were checked against each local Mech
# checkout on 2026-08-25. They are repository-relative POSIX paths so consumers
# never need to infer a sibling-checkout layout.

version: 1

# Canonical capability catalogue. Every Mech must declare every key exactly
# once. The loader rejects omissions and unknown keys, so an absent declaration
# can never silently mean "off". Status is one of enabled / disabled /
# not_applicable; the latter two require a reason.
capability_catalogue:
  id_label_validation: {}
  curation_history: {}
  strict_validation: {}
  schema_sync: {}
  release_management: {}
  build_coordination: {}
  documentation: {}
  testing: {}
  refactoring: {}
  coordination_hooks: {}
  deep_research: {}
  edison_key_discovery: {}
  environment_coverage:
    settings:
      record_globs:
        type: string_list
        required_when_enabled: true
  knowledge_gap_scan:
    settings:
      window:
        type: integer
        required_when_enabled: true
        minimum: 1
  vendored_sync: {}
  unmapped_inventory_input: {}
  source_catalogue: {}
  corpus_statistics:
    settings:
      fields:
        type: string_list
        required_when_enabled: true
  page_budgets:
    settings:
      site_path:
        type: string
        required_when_enabled: true
      budgets_path:
        type: string
        required_when_enabled: true
  kgx_export:
    settings:
      nodes_path:
        type: string
        required_when_enabled: true
      edges_path:
        type: string
        required_when_enabled: true
      extra_prefixes:
        type: string_list
  source_queue:
    settings:
      queue_path:
        type: string
        required_when_enabled: true
      extensions:
        type: string_list
      required_when_adopted:
        type: string_list
  metpo_proposal:
    settings:
      class_glob:
        type: string
        required_when_enabled: true
      property_glob:
        type: string
  sssom_export:
    settings:
      mapping_globs:
        type: string_list
        required_when_enabled: true
      extensions:
        type: string_list
  writer_audit:
    settings:
      search_dirs:
        type: string_list
        required_when_enabled: true
      save_helpers:
        type: string_list
      validators:
        type: string_list
      curation_markers:
        type: string_list
      exclude:
        type: string_list
  site_contract:
    settings:
      site_path:
        type: string
        required_when_enabled: true
      # What a site-absolute reference means, and how far a relative one may
      # climb. Defaults to site_path; they differ when a repository checks part
      # of what it publishes (#238).
      published_root:
        type: string
      allowed_hosts:
        type: string_list

# Vendored shared-file governance is deliberately modeled separately from
# fleet membership: claw is the external authority and must never pin itself.
# The coordinated Phase 1 migration is complete. `transition` remains a
# validated compatibility state for older manifests, but the shipped state is
# `authoritative`: there is no Mech hub, and every Mech is a pinned consumer of
# claw. The loader rejects mixed authoritative state.
vendored_governance:
  state: authoritative
  canonical_repository: CultureBotAI/culturebotai-claw
  manifest_path: src/kg_microbe_governance/vendored_artifacts.json
  pin_path: scripts/.vendored_canon_ref

mechs:
  culturemech:
    display_name: CultureMech
    github: CultureBotAI/CultureMech
    environment_variable: CULTUREMECH_ROOT
    package_path: src/culturemech
    schema_paths:
      - src/culturemech/schema/culturemech.yaml
    record_globs:
      - data/merge_yaml/merged/*.yaml
    vendored_role: consumer
    capabilities:
      id_label_validation:
        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: enabled
      edison_key_discovery:
        status: enabled
      environment_coverage:
        status: enabled
        settings:
          record_globs:
            - data/merge_yaml/merged/*.yaml
      knowledge_gap_scan:
        status: enabled
        settings:
          window: 300
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - source_environment
            - medium_type
      page_budgets:
        status: disabled
        reason: >-
          Generates a site through .github/workflows/generate-pages.yaml but
          declares no size or file-count budgets, so nothing watches it grow.
          Adopting them applies here; the limits are the repository's to set.
        reason_claims:
          present:
            - .github/workflows/generate-pages.yaml
      writer_audit:
        status: enabled
        settings:
          search_dirs: [scripts, src/culturemech]
          save_helpers: [write_validated_recipe]
          exclude: [scripts/audit_writers.py]
      sssom_export:
        status: enabled
        settings:
          mapping_globs: ["output/*.sssom.tsv"]
          extensions: [mapping_method]
      metpo_proposal:
        status: disabled
        reason: >-
          Carries .claude/commands/ground-or-propose-metpo.md, so the grounding
          half is present, but has no proposals/ directory and has never minted
          a METPO id. Adopting applies once a CultureMech term needs one.
        reason_claims:
          absent: ["proposals"]
          present: [".claude/commands/ground-or-propose-metpo.md"]
      kgx_export:
        status: disabled
        reason: >-
          scripts/export_kgx.py writes to output/kgx but has produced nothing
          tracked, so there is no graph for this contract to judge. Adopting it
          means running the exporter first; the check applies here once it does.
        reason_claims:
          present:
            - scripts/export_kgx.py
          absent:
            - output/kgx
      source_queue:
        status: disabled
        reason: >-
          Has no curation/source_queue.tsv. AntibioticMech wrote the pattern and
          CellStructureMech adapted it; adopting it here means ranking this
          corpus's own candidate sources and verifying their licences, which is
          curation work rather than a file copy.
        reason_claims:
          absent:
            - curation/source_queue.tsv
      site_contract:
        status: disabled
        reason: >-
          Publishes a site built in CI, so no directory in the checkout is the
          output the check would judge; running it on the Jekyll or template
          sources reports missing .html files that the build creates. Adopting
          it means running the check on the build product, which applies here
          and is not yet wired.
      source_catalogue:
        status: disabled
        reason: >-
          Fetches each source from its own script --
          scripts/fetch_komodo_base_volumes.py,
          scripts/fetch_mediadive_solution_volumes.py,
          scripts/fetch_pubmed_abstracts.py -- with no download.yaml declaring
          them, so there is no catalogue to validate. Adopting one would apply
          here; it has not been written.
        reason_claims:
          present:
            - scripts/fetch_komodo_base_volumes.py
            - scripts/fetch_mediadive_solution_volumes.py
            - scripts/fetch_pubmed_abstracts.py
          absent:
            - download.yaml
      unmapped_inventory_input:
        status: enabled
    serialization:
      verified: true
      options:
        default_flow_style: false
        sort_keys: false
        allow_unicode: true
        width: 80

  mediaingredientmech:
    display_name: MediaIngredientMech
    github: CultureBotAI/MediaIngredientMech
