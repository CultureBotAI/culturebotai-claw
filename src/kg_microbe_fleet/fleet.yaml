      metpo_proposal:
        status: enabled
        settings:
          class_glob: "proposals/*/metpo_proposal_classes_robot.tsv"
          property_glob: "proposals/*/metpo_proposal_properties_robot.tsv"
      kgx_export:
        status: disabled
        reason: >-
          Publishes trait records and METPO mapping proposals, not a KGX graph.
      source_queue:
        status: disabled
        reason: >-
          Has no curation/source_queue.tsv. AntibioticMech wrote the pattern and
          CellStructureMech adapted it; adopting it here means ranking this
          corpus's own candidate sources and verifying their licences, which is
          curation work rather than a file copy.
        reason_claims:
          absent:
            - curation/source_queue.tsv
      site_contract:
        status: enabled
        settings:
          site_path: pages
          # GitHub Pages serves this repository from main at /, so the whole
          # checkout is published even though only pages/ is checked. Ten trait
          # pages link ../../../app/discussions/, which is served and would
          # otherwise read as climbing out of the site.
          published_root: .
