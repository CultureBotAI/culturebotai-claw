        status: enabled
      deep_research:
        status: disabled
        reason: >-
          Vendors scripts/deep_research_contract.py but has no
          conf/deep_research_provider.yaml or provider recipe. Enable once a
          research provider is configured and exercised under the shared contract.
        reason_claims:
          present: ["scripts/deep_research_contract.py"]
          absent: ["conf/deep_research_provider.yaml"]
      edison_key_discovery:
        status: not_applicable
        reason: >-
          TaxonMech has no Edison integration or Edison research-provider key.
      environment_coverage:
        status: not_applicable
        reason: >-
          Environment coverage compares culture media, ingredients and
          microbial communities; taxon identity records are not one of its inputs.
      knowledge_gap_scan:
        status: disabled
        reason: >-
          The schema supports Discussion but no shared scan window or workflow
          is configured. Enable after adding a durable curated overlay that the
