      page_budgets:
        status: disabled
        reason: >-
          Generates a site through .github/workflows/generate-pages.yaml but
          declares no size or file-count budgets, so nothing watches it grow.
          Adopting them applies here; the limits are the repository's to set.
        reason_claims:
          present:
            - .github/workflows/generate-pages.yaml
      site_contract:
        status: disabled
        reason: >-
          Publishes a site built in CI, so no directory in the checkout is the
          output the check would judge; running it on the Jekyll or template
          sources reports missing .html files that the build creates. Adopting
          it means running the check on the build product, which applies here
          and is not yet wired.
      source_catalogue:
        status: disabled
        reason: >-
          Fetches ontologies through download_ontologies.py rather than a
          declared catalogue, so there is no download.yaml to validate.
          Adopting one would apply here; it has not been written.
        reason_claims:
          present:
            - scripts/download_ontologies.py
          absent:
            - download.yaml
      unmapped_inventory_input:
        status: enabled
    serialization:
      verified: true
      options:
        default_flow_style: false
        sort_keys: false
        allow_unicode: true
        width: 80

  communitymech:
    display_name: CommunityMech
    github: CultureBotAI/CommunityMech
    environment_variable: COMMUNITYMECH_ROOT
    package_path: src/communitymech
    schema_paths:
      - src/communitymech/schema/communitymech.yaml
    record_globs:
      - kb/communities/*.yaml
      - data/isolates/*.yaml
    vendored_role: consumer
    capabilities:
      id_label_validation:
        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: enabled
      edison_key_discovery:
        status: enabled
      environment_coverage:
        status: enabled
        settings:
          # Preserve the dashboard's original isolate-inventory scope. General
          # CommunityMech consumers may also use kb/communities/*.yaml.
          record_globs:
            - data/isolates/*.yaml
      knowledge_gap_scan:
        status: enabled
        settings:
          window: 305
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - environment_term
      page_budgets:
        status: disabled
        reason: >-
          Generates a site through .github/workflows/generate-pages.yaml but
          declares no size or file-count budgets, so nothing watches it grow.
          Adopting them applies here; the limits are the repository's to set.
        reason_claims:
          present:
            - .github/workflows/generate-pages.yaml
      site_contract:
        status: enabled
        settings:
          site_path: docs
      source_catalogue:
        status: disabled
        reason: >-
          Has no download.yaml; its inputs arrive through per-source scripts
          rather than a declared catalogue. Adopting one would apply here;
          it has not been written.
        reason_claims:
          absent:
            - download.yaml
      unmapped_inventory_input:
        status: enabled
    serialization:
      verified: false
      reason: >-
        No PyYAML option set reproduces this corpus, so there is no
        correct value to declare and writing a record back would
        reformat it. Measured in #187.

  traitmech:
    display_name: TraitMech
    github: CultureBotAI/TraitMech
    environment_variable: TRAITMECH_ROOT
    package_path: src/traitmech
    schema_paths:
      - src/traitmech/schema/traitmech.yaml
    record_globs:
      - data/traits/**/*.yaml
    vendored_role: consumer
    capabilities:
      id_label_validation:
        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: enabled
      edison_key_discovery:
        status: enabled
      environment_coverage:
        status: not_applicable
        reason: >-
          Environment coverage currently compares culture media, ingredients,
          and microbial communities; trait records are not an environment
          inventory input.
      knowledge_gap_scan:
        status: enabled
        settings:
          window: 300
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - mapping_status
            - trait_category
      page_budgets:
        status: disabled
        reason: >-
          Serves 490 tracked pages under pages/ straight from main via GitHub
          Pages -- it has no generate-pages.yaml, unlike the other four -- and
          declares no size or file-count budgets, so nothing watches them grow.
          Adopting them applies here; the limits are the repository's to set.
        reason_claims:
          present:
            - pages
          absent:
            - .github/workflows/generate-pages.yaml
      site_contract:
        status: enabled
        settings:
          site_path: pages
          # GitHub Pages serves this repository from main at /, so the whole
          # checkout is published even though only pages/ is checked. Ten trait
          # pages link ../../../app/discussions/, which is served and would
          # otherwise read as climbing out of the site.
          published_root: .
          allowed_hosts:
            - cdn.jsdelivr.net
      source_catalogue:
        status: enabled
      unmapped_inventory_input:
        status: not_applicable
        reason: >-
          The unmapped-ingredient inventory reads culture-media and
          ingredient corpora; TraitMech curates traits and has no
          ingredient records, so scripts/inventory_unmapped_ingredients.py
          defines no loader for it.
        reason_claims:
          present:
            - claw:scripts/inventory_unmapped_ingredients.py
    serialization:
      verified: true
      options:
        default_flow_style: false
        sort_keys: false
        allow_unicode: true
        width: 80

  proteintraitsmech:
    # The GitHub slug is lowercase while the display name is CamelCase. Code
    # that reconstructs the identity from the display name gets a 404, so the
    # `github` field below is authoritative.
    display_name: ProteinTraitsMech
    github: CultureBotAI/proteintraitsmech
    environment_variable: PROTEINTRAITSMECH_ROOT
    package_path: src/proteintraitsmech
    schema_paths:
      - src/proteintraitsmech/schema/proteintraitsmech.yaml
    record_globs:
      - data/traits/**/*.yaml
    vendored_role: consumer
    capabilities:
      id_label_validation:
        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: enabled
      edison_key_discovery:
        status: not_applicable
        reason: >-
          ProteinTraitsMech does not use an Edison research-provider key;
          provider integration is configured through its own supported
          credential surfaces.
      environment_coverage:
        status: not_applicable
        reason: >-
          Environment coverage currently compares culture media, ingredients,
          and microbial communities; protein-trait records are not an
          environment inventory input.
      knowledge_gap_scan:
        status: not_applicable
        reason: >-
          Record-level knowledge-gap scanning targets curated per-record
          discussion text. This corpus is ontology-derived, so there is no
          per-record gap surface to scan; the repository is correspondingly
          absent from the knowledge-gap-scan workflow matrix.
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - trait_axis
            - mapping_status
      page_budgets:
        status: enabled
        settings:
          site_path: _site
          budgets_path: conf/pages_budgets.json
      site_contract:
        status: disabled
        reason: >-
          Publishes a site built in CI, so no directory in the checkout is the
          output the check would judge; running it on the Jekyll or template
          sources reports missing .html files that the build creates. Adopting
          it means running the check on the build product, which applies here
          and is not yet wired.
      source_catalogue:
        status: enabled
      unmapped_inventory_input:
        status: not_applicable
        reason: >-
          The unmapped-ingredient inventory reads culture-media and
          ingredient corpora; ProteinTraitsMech curates protein-trait
          records and has no ingredient corpus, so
          scripts/inventory_unmapped_ingredients.py defines no loader for it.
        reason_claims:
          present:
            - claw:scripts/inventory_unmapped_ingredients.py
    serialization:
      verified: false
      reason: >-
        No PyYAML option set reproduces this corpus, so there is no
        correct value to declare and writing a record back would
        reformat it. Measured in #187.

  cellstructuremech:
    # Joined 2026-08-30 (CellStructureMech#47). Capability decisions below were
    # measured against the repository's tracked files at that date; every
    # disabled/not_applicable status names the issue that would flip it.
    display_name: CellStructureMech
    github: CultureBotAI/CellStructureMech
    environment_variable: CELLSTRUCTUREMECH_ROOT
    package_path: src/cellstructuremech
    schema_paths:
      - src/cellstructuremech/schema/cellstructuremech.yaml
    record_globs:
      - data/structures/**/*.yaml
    vendored_role: consumer
    capabilities:
      # Enabled rather than disabled-with-an-absent-claim (#255): both arrive in
      # CellStructureMech#53, which is open and green, so a claim that the files
      # are absent is true only until that merges. An enabled declaration carries
      # no claim to falsify and lets the fleet audit report the real gap, which
      # is the same choice vendored_sync makes below.
      id_label_validation:
        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: disabled
        reason: >-
          Research so far is source assessment written by hand under research/
          with no provider client or research recipe in the justfile; the
          repository has not decided on a paid research route.
        reason_claims:
          present:
            - research
      edison_key_discovery:
        status: not_applicable
        reason: >-
          CellStructureMech does not use an Edison research-provider key; it has
          no research provider integration at all.
      environment_coverage:
        status: not_applicable
        reason: >-
          Environment coverage currently compares culture media, ingredients,
          and microbial communities; cell-structure records are not an
          environment inventory input.
      knowledge_gap_scan:
        status: disabled
        reason: >-
          Records carry the shared Discussion section, so the scan applies, but
          the corpus is four records and the repository is not yet in the
          knowledge-gap-scan workflow matrix; enable once the first tranche of
          records lands (CellStructureMech#12).
      # An authoritative consumer must sync; the loader rejects anything else.
      # CellStructureMech#48 vendors the artifact set and pin that this
      # declaration obliges; until it lands, the fleet audit reports the gap.
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - structure_category
            - mapping_status
      page_budgets:
        status: disabled
        reason: >-
          Serves tracked pages under pages/ straight from main via GitHub Pages
          -- it has no generate-pages.yaml -- and declares no size or
          file-count budgets, so nothing watches them grow. Adopting them
          applies here; the limits are the repository's to set.
        reason_claims:
          present:
            - pages
          absent:
            - .github/workflows/generate-pages.yaml
      site_contract:
        status: enabled
        settings:
          site_path: pages
      source_catalogue:
        status: disabled
        reason: >-
          The repository keeps its ranked source list as
          curation/source_queue.tsv, machine-checked by
          scripts/check_source_queue.py inside its qc gate, rather than a
          download.yaml in the fleet's catalogue shape; there is no
          download.yaml to parse. Converging on one shape is open.
        reason_claims:
          present:
            - curation/source_queue.tsv
            - scripts/check_source_queue.py
          absent:
            - download.yaml
      unmapped_inventory_input:
        status: not_applicable
        reason: >-
          The unmapped-ingredient inventory reads culture-media and
          ingredient corpora; CellStructureMech curates cell structures and
          has no ingredient records, so scripts/inventory_unmapped_ingredients.py
          defines no loader for it.
        reason_claims:
          present:
            - claw:scripts/inventory_unmapped_ingredients.py
    serialization:
      verified: true
      options:
        default_flow_style: false
        sort_keys: false
        allow_unicode: true
        width: 80
