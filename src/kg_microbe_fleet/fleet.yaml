            - pages
      source_catalogue:
        status: disabled
        reason: >-
          Declares its sources in conf/sources.yaml and the fetched payloads
          in data/raw/MANIFEST.yaml rather than a download.yaml in the fleet's
          catalogue shape; there is no download.yaml to parse. Converging on
          one shape is open.
        reason_claims:
