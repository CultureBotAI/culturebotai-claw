    record_globs:
      - data/traits/**/*.yaml
    vendored_role: consumer
    capabilities:
      evidence_reference_validation:
        status: disabled
        reason: >-
          Measured 2026-11-04 (claw#729): 601,978 of 647,311 quoted items cite a
          database record rather than literature, so those snippets are database
          assertions, not quotations. A reviewed quote-versus-database-assertion
          adapter is required before a literature quote gate applies.
      id_label_validation:
        status: enabled
      record_review:
        status: enabled
      curation_history:
        status: enabled
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: enabled
      edison_key_discovery:
        status: not_applicable
        reason: >-
          ProteinTraitsMech does not use an Edison research-provider key;
          provider integration is configured through its own supported
          credential surfaces.
      environment_coverage:
        status: not_applicable
        reason: >-
          Environment coverage currently compares culture media, ingredients,
          and microbial communities; protein-trait records are not an
          environment inventory input.
      knowledge_gap_scan:
        status: not_applicable
        reason: >-
          Record-level knowledge-gap scanning targets curated per-record
          discussion text. This corpus is ontology-derived, so there is no
          per-record gap surface to scan; the repository is correspondingly
          absent from the knowledge-gap-scan workflow matrix.
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - trait_axis
            - mapping_status
      causal_graph_coverage:
        # Which directories carry graphs is set by source: six source
        # directories hold every graph and the rest hold none, so @directory
        # explains the headline. Only exclusions the Mech itself records are
        # declared. Class-level EC numbers (EC:x.x.x.-) are NOT exempt: the EC
        # builder skips them without saying why, and NEXT_TASKS counts all 410
        # among the EC records that "got no graph at all" -- a gap (#470).
        # No anchor type: a graph is anchored on the node grounded to the
        # record, whose type depends on the source. Duplicate groundings are a
        # modelling convention (a residue grounds to its protein), not a defect.
        status: enabled
        settings:
          graph_shape: graph_list
          record_id_field: identifier
          exempt_when:
            # MappingStatusEnum.DEPRECATED: "Superseded by another
            # ProteinTraitRecord."
            - "mapping_status=DEPRECATED"
            # NEXT_TASKS: these METPO records "are metabolic strategies, not
            # protein traits, so their causal graphs belong in" TraitMech.
            - "path:data/traits/function/enzymatic_activity/metpo/*.yaml"
          strata:
            - trait_axis
            - "@directory"
      page_budgets:
        status: enabled
        settings:
          site_path: _site
          budgets_path: conf/pages_budgets.json
      writer_audit:
        status: not_applicable
        reason: >-
          Its scripts/audit_writers.py shares the name and nothing else -- a
          different tool built on registered editors and guard tests, ~600
          lines apart from the other four. This audit does not describe what
          that one checks, and consolidating them would mean choosing one
          model over the other rather than removing a duplicate.
        reason_claims:
          present:
            - scripts/audit_writers.py
      sssom_export:
        status: disabled
        reason: >-
          Keeps its equivalences as a Biolink mapping overlay under
          data/equivalence/ and a ChEBI crosswalk in
          data/mappings/cofactor_crosswalk.tsv rather than as SSSOM, so there
          is no SSSOM file for this contract to judge. SSSOM export applies
          here, as to every Mech (#503); adoption is pending
          (proteintraitsmech#805).
        reason_claims:
          present:
            - data/equivalence
            - data/mappings/cofactor_crosswalk.tsv
      metpo_proposal:
        status: disabled
        reason: >-
          Carries METPO-grounded records under data/traits/**/metpo/, so it
          consumes METPO, but proposes no new terms and has no proposals/
          directory. Adopting applies once a protein trait needs a term METPO
          lacks.
        reason_claims:
          absent: ["proposals"]
      kgx_export:
        status: disabled
        reason: >-
          Publishes protein-trait records, not yet a KGX graph. KGX export
          applies here, as to every Mech (#503); adoption is pending
          (proteintraitsmech#805).
      source_queue:
        status: disabled
        reason: >-
          Has no curation/source_queue.tsv. AntibioticMech wrote the pattern and
          CellStructureMech adapted it; adopting it here means ranking this
          corpus's own candidate sources and verifying their licences, which is
          curation work rather than a file copy.
        reason_claims:
          absent:
            - curation/source_queue.tsv
      site_contract:
        status: disabled
        reason: >-
          Publishes a site built in CI, so no directory in the checkout is the
          output the check would judge; running it on the Jekyll or template
          sources reports missing .html files that the build creates. Adopting
          it means running the check on the build product, which applies here
          and is not yet wired.
      source_catalogue:
        status: enabled
      unmapped_inventory_input:
        status: not_applicable
        reason: >-
          The unmapped-ingredient inventory reads culture-media and
          ingredient corpora; ProteinTraitsMech curates protein-trait
          records and has no ingredient corpus, so
          scripts/inventory_unmapped_ingredients.py defines no loader for it.
        reason_claims:
          present:
            - claw:scripts/inventory_unmapped_ingredients.py
    serialization:
      verified: false
      reason: >-
        No PyYAML option set reproduces this corpus, so there is no
        correct value to declare and writing a record back would
        reformat it. Measured in #187.

