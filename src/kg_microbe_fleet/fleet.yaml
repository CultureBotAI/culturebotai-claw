  naturalproductmech:
    # Joined 2026-09-11. Capability reasons are refreshed against published
    # main; native inline history and canonical sidecar CI are distinct gates.
    display_name: NaturalProductMech
    github: CultureBotAI/NaturalProductMech
    environment_variable: NATURALPRODUCTMECH_ROOT
    package_path: src/naturalproductmech
    schema_paths:
      - src/naturalproductmech/schema/naturalproductmech.yaml
    record_globs:
      - data/natural_products/**/*.yaml
    vendored_role: consumer
    # Measured on joining: all 3,115 records round-trip byte-identically under
    # this option set, so dump_record may write them back without reformatting.
    serialization:
      verified: true
      options:
        default_flow_style: false
        sort_keys: false
        allow_unicode: true
        width: 80
    capabilities:
      evidence_reference_validation:
        status: disabled
        reason: >-
          Measured 2026-11-04 (claw#729): none of 3,554 quoted items cites a PMID;
          2,052 cite web or database sources and 1,502 cite DOIs. A reviewed
          adapter for those sources, and a measurement of the DOI-cited quotes,
          come before adoption.
      id_label_validation:
        status: enabled
      record_review:
        status: enabled
      curation_history:
        status: disabled
        reason: >-
          Native inline and component history exists, history/ contains canonical
          sidecars, and justfile provides new-history. The scripts/run_qc.py
          command list does not include canonical sidecar validation or
          append-only checking. Shared curation-history adoption remains disabled
          pending verified CI enforcement of that separate corpus; record_review
          does not enable curation.
        reason_claims:
          present: ["history", "justfile", "scripts/run_qc.py"]
      # Closed-schema validation (scripts/validate_strict.py, closed=True) and
      # ruff both run on every PR through scripts/run_qc.py from main.yaml. The
      # fleet convention names that workflow validate-strict.yaml; the gate is
      # what the capability declares, and the gate is present.
      strict_validation:
        status: enabled
      schema_sync:
        status: enabled
      release_management:
        status: enabled
      build_coordination:
        status: enabled
      documentation:
        status: enabled
      testing:
        status: enabled
      refactoring:
        status: enabled
      coordination_hooks:
        status: enabled
      deep_research:
        status: disabled
        reason: >-
          No conf/deep_research_provider.yaml and no research recipe; sources
          are assessed through the source queue. Adopting applies once a
          provider profile exists under claw's contract.
        reason_claims:
          absent: ["conf/deep_research_provider.yaml"]
      edison_key_discovery:
        status: not_applicable
        reason: >-
          NaturalProductMech does not use an Edison research-provider key; it
          has no research provider integration at all.
      environment_coverage:
        status: not_applicable
        reason: >-
          Environment coverage compares culture media, ingredients and
          microbial communities. A natural-product structure corpus is not one
          of those inputs.
      knowledge_gap_scan:
        status: disabled
        reason: >-
          Records do not carry the shared Discussion section the scan reads,
          and this repository is not in the knowledge-gap-scan workflow
          matrix. Enable once records carry it.
      vendored_sync:
        status: enabled
      corpus_statistics:
        status: enabled
        settings:
          fields:
            - np_pathway
            - np_classification
            - grounding_status
            - curation_status
      causal_graph_coverage:
        # scope says which mechanism a graph describes (BIOSYNTHESIS or
        # BIOACTIVITY), not whether it is one, so it is a facet rather than a
        # scope_field. Nodes ground through identifier. A fragmented graph that
        # says it is partial passes the Mech's own test and is still reported
        # here as FRAGMENTED_GRAPH.
        status: enabled
        settings:
          graph_shape: graph_list
          record_id_field: identifier
          node_grounding_field: identifier
          graph_facets: [scope]
          anchor_node_types: [COMPOUND]
          duplicate_grounding_check: true
          exempt_when:
            # CurationStatusEnum.DEPRECATED: "Superseded or found out of scope;
            # retained for traceability."
            - "curation_status=DEPRECATED"
          strata:
            - np_pathway
      page_budgets:
        status: disabled
        reason: >-
          Serves tracked pages under pages/ straight from main via GitHub
          Pages and declares no size or file-count budgets, so no
          conf/pages_budgets.json exists for the audit to read.
        reason_claims:
          present: ["pages"]
          absent: ["conf/pages_budgets.json"]
      writer_audit:
        status: disabled
        reason: >-
          Has no scripts/audit_writers.py, so there is no drift between
          writer copies to remove yet. Adopting it applies here once the
          corpus is edited by more than one writer.
        reason_claims:
          absent: ["scripts/audit_writers.py"]
      sssom_export:
        status: disabled
        reason: >-
          Records carry ChEBI, NPAtlas and PubChem identifiers inline rather
          than through a mapping file, so there is no SSSOM file for this
          contract to judge. SSSOM export applies here, as to every Mech
          (#503); adoption is pending (NaturalProductMech#223).
      metpo_proposal:
        status: disabled
        reason: >-
          No proposals directory and no METPO grounding; structures are
          grounded in ChEBI. Adopting applies once a natural-product
          phenotype needs a METPO term.
        reason_claims:
          absent: ["proposals"]
      kgx_export:
        status: disabled
        reason: >-
          No exporter and no graph product yet. KGX export applies here, as to
          every Mech (#503); adoption is pending (NaturalProductMech#223).
      source_queue:
        status: enabled
        settings:
          queue_path: curation/source_queue.tsv
          extensions: ["structures"]
      site_contract:
        status: enabled
        settings:
          site_path: pages
      source_catalogue:
        status: disabled
        reason: >-
          Keeps its ranked source list as curation/source_queue.tsv and
          fetches each adopted source through its own extract recipe; there
          is no download.yaml for the catalogue check to read. Adopting means
          deriving the machine-fetchable half from the queue.
        reason_claims:
          present: ["curation/source_queue.tsv"]
          absent: ["download.yaml"]
      unmapped_inventory_input:
        status: not_applicable
        reason: >-
          The unmapped inventory reconciles ingredient names across media
          corpora; natural-product structures are not one of its inputs.

  taxonmech:
    # Inspected on joining, 2026-09-11, at committed main 42c8e490.
    # Records are generated from inventories and scope: shared readers may
