          Adopting them applies here; the limits are the repository's to set.
        reason_claims:
          present:
            - .github/workflows/generate-pages.yaml
      writer_audit:
        status: enabled
        settings:
          search_dirs: [scripts, src/mediaingredientmech]
          save_helpers: [save_yaml, write_validated_ingredient]
          exclude: [scripts/audit_writers.py]
      sssom_export:
        status: enabled
        settings:
          mapping_globs: ["mappings/*.sssom.tsv"]
          extensions: [source, validation_method]
      metpo_proposal:
        status: not_applicable
        reason: >-
          MIM grounds ingredients in ChEBI and FOODON and publishes SSSOM
          mappings; METPO models microbial phenotypes and processes, which is
          not the axis this corpus curates.
      kgx_export:
        status: disabled
        reason: >-
          Publishes term mappings rather than a graph; its contribution to
          kg-microbe is SSSOM. Adopting KGX would apply here only if it starts
          emitting nodes and edges.
      source_queue:
        status: disabled
        reason: >-
          Has no curation/source_queue.tsv. AntibioticMech wrote the pattern and
          CellStructureMech adapted it; adopting it here means ranking this
          corpus's own candidate sources and verifying their licences, which is
          curation work rather than a file copy.
        reason_claims:
          absent:
            - curation/source_queue.tsv
      site_contract:
        status: disabled
        reason: >-
          Publishes a site built in CI, so no directory in the checkout is the
          output the check would judge; running it on the Jekyll or template
          sources reports missing .html files that the build creates. Adopting
          it means running the check on the build product, which applies here
          and is not yet wired.
      source_catalogue:
        status: disabled
        reason: >-
          Fetches ontologies through download_ontologies.py rather than a
          declared catalogue, so there is no download.yaml to validate.
          Adopting one would apply here; it has not been written.
        reason_claims:
          present:
            - scripts/download_ontologies.py
          absent:
            - download.yaml
      unmapped_inventory_input:
        status: enabled
    serialization:
      verified: true
      options:
        default_flow_style: false
        sort_keys: false
        allow_unicode: true
        width: 80

