        status: not_applicable
        reason: >-
          The unmapped-ingredient inventory reads culture-media and
          ingredient corpora; TraitMech curates traits and has no
          ingredient records, so scripts/inventory_unmapped_ingredients.py
          defines no loader for it.
        reason_claims:
          present:
            - claw:scripts/inventory_unmapped_ingredients.py
