name: QC — evidence reference validation

# Every PR and queue candidate must report the gate. The quote check is offline:
# no source fetching, cache repair, research model or provider credit is invoked.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  qc:
    name: qc-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout active Mech revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mech
          persist-credentials: false

      - name: Read immutable Claw revision
        id: claw-pin
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import os
          import re
          from pathlib import Path

          pin_path = Path("mech/scripts/.vendored_canon_ref")
          if pin_path.is_symlink() or not pin_path.is_file():
              raise SystemExit("Canonical pin must be a regular, non-symlink file")
          with pin_path.open("rb") as stream:
              pin = stream.read(64)
          if re.fullmatch(rb"[0-9a-f]{40}\n?", pin) is None:
              raise SystemExit("Canonical pin must contain one full lowercase commit SHA")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("ref=" + pin.decode("ascii").strip() + "\n")
          PY

      - name: Checkout pinned Claw validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CultureBotAI/culturebotai-claw
          ref: ${{ steps.claw-pin.outputs.ref }}
          path: claw
          persist-credentials: false

      - name: Install Python runner
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false

      - name: Install pinned validator dependencies
        run: uv sync --project claw --locked

      - name: Validate quoted evidence against committed sources
        working-directory: mech
        env:
          CLAW_ROOT: ${{ github.workspace }}/claw
        run: uv run --project ../claw --frozen python -I scripts/run_shared_evidence_validator.py --strict

      - name: Record evidence validation report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=mech/workspace/reports/evidence_reference_validation.md
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Evidence validation did not produce a report; inspect the failed preflight step.' >> "$GITHUB_STEP_SUMMARY"
          fi
