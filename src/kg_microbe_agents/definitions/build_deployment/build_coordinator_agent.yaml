agent:
  name: build_coordinator_agent
  type: build_deployment
  description: "Multi-repository build coordination and justfile orchestration"
  version: "1.0.0"

model:
  provider: anthropic
  model: claude-haiku-4-5-20250115
  temperature: 0.1
  max_tokens: 4096

repository_scope:
  source: fleet_manifest
  capability: build_coordination

# The CLI currently supports validated dry-runs only. Fleet-wide execution is
# intentionally disabled until each Mech supplies a validated native-command
# profile; missing profiles must never fall back to guessed `just` recipes.
execution:
  status: disabled
  reason: "Per-Mech build command profiles are not yet part of the fleet contract"

workspace:
  base_dir: ${OPENCLAW_WORKSPACE}
  allowed_paths:
    source: repository_scope
    patterns:
      - "**"
  create_backups: false  # Build artifacts don't need backup
  backup_dir: ${OPENCLAW_WORKSPACE}/.backups/builds

tools:
  - name: just_runner
    type: plugin
    plugin: just_runner
    description: "Execute justfile recipes across repositories"

  - name: git_status
    type: plugin
    plugin: git_integration
    method: status
    description: "Check git status across repositories"

  - name: validation
    type: plugin
    plugin: linkml_validator
    description: "Validate data against LinkML schemas"

safety:
  dry_run_default: true
  require_approval_for:
    - build_all_repos
    - publish_artifacts
  validation_required: true
  pre_build_checks:
    - git_status_clean
    - all_tests_passing

monitoring:
  track_build_time: true
  log_all_commands: true
  generate_build_report: true

tasks:
  # Task 1: Validate all repositories before build
  validate_all_repos:
    description: "Run validation across every repository in scope"
    parameters:
      - name: quick
        type: bool
        default: false
        description: "Quick validation (schema only) vs full validation"
    workflow:
      - step: validate_repositories
        action: "Validate that every repository has an approved native-command profile"
        repositories:
          source: repository_scope
      - step: aggregate_results
        output:
          - repository_statuses
          - overall_status

  # Task 2: Build all repositories in correct order
  build_all_repos:
    description: "Execute builds across repositories in dependency order"
    parameters:
      - name: skip_tests
        type: bool
        default: false
      - name: dry_run
        type: bool
        default: true
    workflow:
      - step: check_git_status
        action: "Ensure working directories are clean"
      - step: build_repositories
        action: "Refuse execution until validated native build profiles are available"
        repositories:
          source: repository_scope
      - step: run_tests
        action: "Run test suites if not skipped"
        condition: "not skip_tests"
      - step: generate_report
        output:
          - build_duration
          - tests_passed
          - validation_status

  # Task 3: Coordinate fresh build from scratch
  fresh_build:
    description: "Bootstrap build sequence for cold start"
    workflow:
      - step: bootstrap_repositories
        action: "Refuse execution until validated cold-start profiles are available"
        repositories:
          source: repository_scope

  # Task 4: Generate build artifacts
  generate_artifacts:
    description: "Generate browser exports, KGX files, visualizations"
    parameters:
      - name: formats
        type: list
        default: ["browser", "kgx", "umap"]
    workflow:
      - step: generate_repository_artifacts
        action: "Refuse execution until validated artifact profiles are available"
        repositories:
          source: repository_scope

  # Task 5: Check build status across repos
  check_build_status:
    description: "Check current build state of all repositories"
    workflow:
      - step: git_status_all
        action: "Check git status (uncommitted changes, branches)"
      - step: last_build_time
        action: "Check timestamps of generated files"
      - step: validation_status
        action: "Quick validation check"
      - step: generate_report
        output:
          - repo_states
          - build_freshness
          - validation_results

  # Task 6: Incremental build (only what changed)
  incremental_build:
    description: "Smart rebuild based on what changed"
    parameters:
      - name: since_commit
        type: string
        required: false
        description: "Git commit to compare against"
    workflow:
      - step: detect_changes
        action: "Git diff to find changed files"
      - step: identify_affected_repos
        action: "Determine which repos need rebuilding"
      - step: minimal_rebuild
        action: "Run only necessary build steps"

integration:
  native_command_profiles:
    status: deferred
    missing_profile_policy: fail_closed
    required_fields:
      - validation_commands
      - build_commands
      - fresh_build_commands
      - artifact_commands
      - dependency_order

reporting:
  format: yaml
  include:
    - build_duration_per_repo
    - validation_results
    - test_results
    - artifact_sizes
    - git_status
  save_to: ${OPENCLAW_WORKSPACE}/reports/builds/
