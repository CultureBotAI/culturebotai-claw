agent:
  name: documentation_agent
  type: code_development
  description: "Generate and update documentation for schemas, data, and code"
  version: "1.0.0"

model:
  provider: anthropic
  model: claude-haiku-4-5
  temperature: 0.1
  max_tokens: 8192

repository_scope:
  source: fleet_manifest
  capability: documentation

workspace:
  base_dir: ${OPENCLAW_WORKSPACE}/documentation_agent
  allowed_paths:
    source: repository_scope
    patterns:
      - "docs/**"
      - "README.md"
      - "src/**/schema/*.yaml"
  read_only: false
  create_git_branches: true

tools:
  - name: just_runner
    type: plugin
    plugin: just_runner
    config:
      allowed_recipes:
        - gen-doc
        - gen-project-docs
        - sphinx-apidocs
        - gendoc

  - name: git_integration
    type: plugin
    plugin: git_integration
    config:
      auto_commit: false
      branch_prefix: "agent/documentation/"

  - name: file_reader
    type: builtin
    description: "Read schema and code files"

  - name: file_writer
    type: builtin
    description: "Write documentation files"
    allowed_extensions:
      - .md
      - .rst
      - .txt

capabilities:
  - generate_schema_docs
  - update_readme
  - create_api_docs
  - generate_data_dictionaries
  - update_changelog
  - generate_usage_examples

tasks:
  generate_schema_docs:
    description: "Generate documentation from LinkML schemas"
    parameters:
      - repo: {type: string, required: true, choices_from: repository_scope}
      - output_format: {type: string, default: markdown, enum: [markdown, rst, html]}
    workflow:
      - step: read_schema
        description: "Read the LinkML schema file"
      - step: parse_schema
        description: "Extract classes, slots, enums, and descriptions"
      - step: generate_docs
        description: "Create formatted documentation"
      - step: save_docs
        output: "docs/schema/${repo}_schema.md"

  update_readme:
    description: "Update repository README with latest information"
    parameters:
      - repo: {type: string, required: true}
      - sections: {type: list, default: [overview, installation, usage, examples]}
    workflow:
      - step: read_current_readme
      - step: analyze_repository
        description: "Scan for new features, changes, examples"
      - step: update_sections
        description: "Update specified README sections"
      - step: create_pull_request
        branch: "agent/documentation/update-readme"

  generate_data_dictionary:
    description: "Create data dictionary for culture media or ingredients"
    parameters:
      - repo: {type: string, required: true}
      - data_type: {type: string, required: true}
    workflow:
      - step: analyze_data_files
        description: "Extract unique fields and their usage patterns"
      - step: generate_dictionary
        description: "Create structured data dictionary"
      - step: save_dictionary
        output: "docs/data_dictionary_${data_type}.md"

  update_changelog:
    description: "Update CHANGELOG.md with recent changes"
    parameters:
      - repo: {type: string, required: true}
      - version: {type: string, required: false}
    workflow:
      - step: read_git_log
        tool: git_integration
        description: "Get commits since last release"
      - step: categorize_changes
        description: "Group changes into Added, Changed, Fixed, etc."
      - step: update_changelog
        output: "CHANGELOG.md"

  generate_all_docs:
    description: "Generate complete documentation suite for a repository"
    parameters:
      - repo: {type: string, required: true}
    workflow:
      - step: generate_schema_docs
      - step: generate_data_dictionary
      - step: update_readme
      - step: update_changelog
      - step: run_just_gendoc
        tool: just_runner
        recipe: gen-doc

output:
  format: markdown
  include_examples: true
  save_to: ${OPENCLAW_WORKSPACE}/documentation_agent/generated/
  git_branch_prefix: "agent/documentation/"

safety:
  require_approval_for:
    - readme_updates
    - changelog_updates
  auto_approve:
    - schema_docs
    - data_dictionaries
  create_backups: true

git_integration:
  create_branches: true
  auto_commit: false
  commit_message_template: |
    docs: ${task_description}

    Generated by DocumentationAgent
    - Task: ${task_name}
    - Files: ${modified_files}

    Co-Authored-By: Claude Haiku 4.5 <noreply@anthropic.com>
