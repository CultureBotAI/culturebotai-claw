version: 1
checked_on: '2026-10-09'
reference: https://github.com/CultureBotAI/proteintraitsmech/tree/9c563d320b0b39548daf119812a5e25298236b63
coordination:
- https://github.com/CultureBotAI/culturebotai-claw/issues/426
- https://github.com/CultureBotAI/culturebotai-claw/pull/432
policy:
  primary_projection: pacmap
  multiple_sets: true
  registry_adoption: planned
acceptance:
- Choose sets by corpus and entity applicability. Protein language models are relevant only to sequence-bearing
  entities; chemical structure sets need grounded compounds. Omit unrelated modalities instead of creating blocked
  placeholders. Additional modalities and representations can be added without changing the projection contract.
- Keep definition-only and whole-record text as independently identified representations of the text modality, even
  when they share an encoder, entity IDs and dimensions. Preserve each versioned input recipe, source hash, vectors,
  coverage and neighbours. Multiple-set support does not require every Mech to populate every type or a minimum
  number of sets.
- Add a versioned registry with unique set IDs, exact encoder/input recipe, immutable source/model revisions, ordered
  ID/vector hashes and per-set coverage. Export existing vectors through the shared projection adapter; retain verified
  existing text bundles from PR 432 where appropriate.
- Use a named-set selector with separate caches, labels, point populations and original-space neighbour indexes.
  Lazy-load only the chosen set; show planned/blocked reasons and preserve valid record links when switching.
- Run an offline two-set contract test and a real bounded PaCMAP canary. Require finite coordinates, source/ID alignment,
  actual method/version/parameters, corruption rejection and honest displayed/eligible/total coverage before publication.
- Integrate through the existing rollout and native gates. Verify current-source artifacts and live desktop/mobile
  behavior before changing the X-Mech website support verdict or declaring registry adoption complete.
