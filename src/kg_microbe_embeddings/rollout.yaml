        state: planned
        notes: Whole-record semantic text follows a versioned include/exclude recipe, distinct from a definition-only
          set. Keep the actual encoder identity. The common BGE model is BAAI/bge-large-en-v1.5 at d4aa6901d3a41ba39fb536a557fa166f842b0e09,
          1024 dimensions; adopting it requires real vectors, not a metadata rename.
        representation: whole_record
      kg-microbe-graph:
        modality: graph
        entity_type: medium
        state: native
        notes: Preserve the source KG-Microbe release, vector lookup/aggregation recipe and missing-vector coverage;
          select a separate PaCMAP artifact.
        representation: graph_features
      ingredient-graph:
        modality: graph
        entity_type: ingredient
        state: native
        notes: Ingredient vectors are a different point population from media/recipe vectors; use independent IDs,
          coverage and links.
        representation: graph_features
