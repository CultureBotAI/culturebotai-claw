# What each skill in .claude/skills/ is for, and who it applies to (#132 Phase 4).
#
# The point of declaring this is that "general" was previously a hardcoded set
# of five names inside a test, invisible to anything else and drifting silently
# as skills were added -- the same shape #131 is removing everywhere else in
# this repository.
#
# scope:
#   claw    the control plane's own workflow; no Mech runs it
#   fleet   resolves the repositories it acts on FROM THE MANIFEST at runtime,
#           so there is nothing to render per Mech. This is the same meaning
#           the skill's own `fleet` tag carries, and the two must agree: a
#           scope that contradicted the declaration would just be a second
#           opinion nobody checks.
#   domain  scientific policy specific to one corpus; deliberately not general
#
# `canonical:` below is a different question from `skills:`. `skills:` governs
# what lives in this repository; `canonical:` declares the templates from which
# each applicable Mech's adapter is RENDERED. They are separate because claw's
# own copy of a skill is claw's, aimed at claw's queue and guarantees, while
# the template is written with placeholders and is unusable as a skill until
# filled. Conflating them would mean either claw runs a skill full of
# `{{ }}` or the template is quietly claw-shaped.
version: 1

skills:
  boss:
    scope: fleet
    reason: Orchestrates parallel work across manifest-resolved worktrees.
  cas-rn-integration:
    scope: domain
    reason: CAS Registry enrichment of MIM ingredient records.
  complex-ingredient-resolver:
    scope: domain
    reason: Multi-ontology cascade for heuristic-complex MIM ingredients.
  cross-mech-sync:
    scope: fleet
    reason: Propagates a vendored artifact across manifest-declared consumers.
  cross-repo-sync:
    scope: claw
    reason: >-
      Reconciles identifiers across a named set -- CultureMech, MIM and
      kg-microbe, which is not a Mech at all. It does not resolve the fleet
      from the manifest, which is what `fleet` means here and what the skill's
      own `fleet` tag asserts.
  evidence-curation:
    scope: domain
    reason: Proposes PMID evidence for MIM ingredient claims.
  evidence-reference-validation:
    scope: domain
    reason: Anti-hallucination gate over MIM literature evidence.
  feba-integration:
    scope: domain
    reason: FEBA functional-enrichment import into MIM.
  fleet-pr-review:
    scope: fleet
    reason: Reviews open PRs across the manifest-defined control plane.
  fleet-pr-status:
    scope: fleet
    reason: Answers "what is open" across claw and the manifest-defined Mechs.
  github-pages-status:
    scope: fleet
    reason: >-
      Answers whether every Mech's published site is current, discovering
      repositories from the org rather than the manifest so a Mech that has
      not joined yet is still checked.
  ingredient-mapping:
    scope: domain
    reason: Imports a new ingredient source into MIM with provenance.
  kg-microbe-review:
    scope: claw
    reason: Reviews kg-microbe, which is not a Mech and has no adapter.
  kg-microbe-sync:
    scope: claw
    reason: Snapshots kg-microbe files into claw's own workspace.
  map-ingredients:
    scope: domain
    reason: Runs the unified ingredient-mapping pipeline over MIM.
  mapping-taxonomy:
    scope: domain
    reason: Documents the MIM to kg-microbe mapping cases.
  publish-sssom:
    scope: domain
    reason: Builds and promotes MIM's canonical SSSOM product.
  review-open-issues:
    scope: claw
    reason: >-
      Triages claw's own queue against the control plane. The same task in a
      Mech is rendered from the canonical template below, not shared with this
      file.
  schema-gap-analysis:
    scope: fleet
    reason: Selects its target repository from the manifest at runtime.
  specificity-loss-review:
    scope: domain
    reason: Detects over-general ontology terms in MIM mappings.
  synonym-review:
    scope: domain
    reason: Cross-checks MIM SSSOM synonyms against CHEBI.
  team-review-sssom:
    scope: domain
    reason: Parallel agent review of MIM's SSSOM product.
  unmapped-inventory:
    scope: fleet
    reason: >-
      Reads the Mechs declaring `unmapped_inventory_input`, resolved from the
      manifest rather than from a list in the skill (#214). kg-microbe is read
      too but is not a Mech and is not in the manifest.

# Canonical templates, rendered per applicable Mech. `capability` decides which
# Mechs those are -- from the manifest, so the set cannot drift the way a list
# written here would the moment a Mech gained or lost the capability.
canonical:
  next-tasks:
    capability: testing
    reason: >-
      Four of the five Mechs that carry this skill have byte-identical
      reconcile commands and byte-identical convention bullets; CommunityMech
      has drifted one bullet. Those two blocks are the shared part, and they
      are what the canonical regions cover.

      Everything else in this skill is deliberately NOT canonical. The traps
      section is the reason anyone reads it -- CultureMech's two data surfaces,
      TraitMech's upstream-blocked default -- and a template that rendered over
      them would leave five adapters that look unified and have lost the only
      content worth having (#293). So the template marks two regions and leaves
      the rest to the Mech, which is what canonical:begin/end is for.
  fetch-source:
    capability: testing
    reason: >-
      Five Mechs carry this skill and three of those five are byte-identical --
      copy-paste propagation, not agreement. ProteinTraitsMech's is a
      generation ahead: it routes through a helper that validates before it
      promotes and replaces atomically. The other four teach a *hardened*
      `curl` -- retries and timeouts, writing straight to the destination --
      which reads as the solved version and is not: curl's --retry does not
      cover the early-close and reset exits, and -f does not catch a 200
      carrying an HTML error page. So this template is not a merge of five
      equals; it
      carries the one version that is right and leaves each Mech its own route
      and worked example.

      The capability is a stand-in and should be read as one. No declared
      capability means "ingests external source releases", which is what
      actually decides who needs this -- every Mech does, including the three
      that have no such skill today. `source_catalogue` is deliberately NOT the
      gate: it selects three Mechs, while five already carry the skill and four
      of those five declare it disabled. It describes owning a download.yaml
      catalogue, not fetching. Filed as #316.

  review-open-issues:
    capability: testing
    reason: >-
      Triaging an open issue queue against a repository's own guarantees is the
      same task in every Mech. What differs -- the repository, its corpus
      globs, its schema, the variable naming its checkout -- comes from the
      manifest, which is exactly what a rendered adapter is for.
