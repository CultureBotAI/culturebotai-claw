name: authoritative governance fleet audit

# Audit the public Mech mains with code from trusted claw base/main. Downstream
# pins are treated only as data. Historical cohort refs retain their exact
# release rules; infrastructure data requires a protected explicit admission.
# Public Git/GitHub reads and deterministic local
# checks never invoke a model, research provider, credentialed service, or paid API.

on:
  schedule:
    - cron: "41 6 * * *"
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fleet-audit:
    name: public-fleet
    needs: candidate-contracts
    permissions:
      contents: read
      actions: read
    outputs:
      automatic_available: ${{ steps.automatic.outputs.available }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false

      # Pull requests use their exact protected-base commit as the trusted audit
      # runner, merge groups use their exact base SHA, main pushes use their
      # triggering commit, and schedules/manual
      # runs use main even if workflow_dispatch selected another candidate ref.
      # A downstream pin never selects executable audit or install code.
      - name: Check out trusted claw revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.sha || 'main' }}
          path: fleet/trusted-claw
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.13"
          enable-cache: false
          working-directory: fleet/trusted-claw

      - name: Install trusted governance package
        run: uv sync --project fleet/trusted-claw --locked

      - name: Select installed protected automatic adapter
        id: automatic
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PYCODE'
          import json, os
          from pathlib import Path
          installed = Path("fleet/trusted-claw/src/kg_microbe_governance/automatic_fleet_component.py").is_file()
          candidate = json.loads(Path("control/src/kg_microbe_governance/vendored_artifacts.json").read_bytes())
          protected = json.loads(Path("fleet/trusted-claw/src/kg_microbe_governance/vendored_artifacts.json").read_bytes())
          if not installed and any("scaleupmech" in x["consumers"] for x in (candidate, protected)):
              raise SystemExit("Private obligations require the protected automatic adapter")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("available=" + str(installed).lower() + "\n")
          PYCODE

      - name: Audit protected public fleet and candidate completeness
        if: steps.automatic.outputs.available == 'true'
        env:
          GH_PUBLIC_READ_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: >-
          uv run --project fleet/trusted-claw --locked --no-dev python -m kg_microbe_governance.automatic_fleet_component
          --trusted-root "$GITHUB_WORKSPACE/fleet/trusted-claw"
          --workspace "$GITHUB_WORKSPACE/fleet/automatic-public"
          --checkout-sha "$CANDIDATE_SHA" --output "$GITHUB_WORKSPACE/fleet/report/receipt.json"

      - name: Publish bounded public component report
        if: steps.automatic.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-fleet-${{ github.run_id }}-${{ github.run_attempt }}
          path: fleet/report/receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Prepare protected infrastructure data snapshot
        if: steps.automatic.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          trusted="$GITHUB_WORKSPACE/fleet/trusted-claw"
          selector="$trusted/src/kg_microbe_governance/infrastructure_admission.py"
          # Historical trusted checkouts have no admission and need no new code.
          # Candidate policy and downstream pins cannot select this fetch target.
          if [ ! -f "$selector" ]; then
            exit 0
          fi
          source_ref="$(uv run --project "$trusted" python -m kg_microbe_governance.infrastructure_admission \
            --trusted-root "$trusted")"
          # A protected selector with no active declaration emits no data ref.
          if [ -z "$source_ref" ]; then
            exit 0
          fi
          if ! [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'Refusing invalid infrastructure data ref' >&2
            exit 2
          fi
          # Fetch only immutable DATA objects, leaving refs, HEAD and FETCH_HEAD alone.
          git -C "$trusted" -c core.hooksPath=/dev/null fetch \
            --no-tags --no-prune --no-write-fetch-head origin "$source_ref"

      - name: Export manifest-defined governance consumers
        if: steps.automatic.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fleet
          uv run --project fleet/trusted-claw python - > fleet/governance-consumers.tsv <<'PY'
          from kg_microbe_governance import load_governance_manifest

          manifest = load_governance_manifest()
          for consumer in manifest.consumers.values():
              print(
                  "\t".join(
                      (
                          consumer.key,
                          consumer.github,
                          consumer.package_path,
                          manifest.pin_path,
                      )
                  )
              )
          PY
          test -s fleet/governance-consumers.tsv

      - name: Check out manifest-defined Mech mains
        if: steps.automatic.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r key github package_path pin_path; do
            root="$GITHUB_WORKSPACE/fleet/$key"
            git clone --filter=blob:none --no-checkout --depth 1 --branch main \
              "https://github.com/$github.git" "$root"

            sparse_paths=("$pin_path")
            while IFS=$'\t' read -r _repository _artifact _source target _sha _mode; do
              sparse_paths+=("$target")
            done < <(
              uv run --project fleet/trusted-claw kg-microbe-governance list \
                --repository "$key"
            )
            test "${#sparse_paths[@]}" -gt 1
            git -C "$root" sparse-checkout init --no-cone
            git -C "$root" sparse-checkout set --no-cone "${sparse_paths[@]}"
            git -C "$root" checkout --detach origin/main
          done < fleet/governance-consumers.tsv

      # Only trusted base/main can select this lane. A candidate declaration
      # cannot authorize its own downstream rollout before Claw merges it.
      - name: Select trusted release contract
        if: steps.automatic.outputs.available != 'true'
        id: release-contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import os
          from pathlib import Path

          declaration = Path("fleet/trusted-claw/src/kg_microbe_governance/releases/mech-cycle-v2-canary.json")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("active=" + ("true" if declaration.exists() else "false") + "\n")
          PY

      - name: Read and compare every committed fleet pin
        if: steps.automatic.outputs.available != 'true' && steps.release-contract.outputs.active != 'true'
        id: fleet-pin
        shell: bash
        run: |
          set -euo pipefail
          # PYTHONPATH is the CANDIDATE checkout, not fleet/trusted-claw.
          # trusted-claw is the PR's base commit by design, so a function added
          # by this PR does not exist there -- importing it from trusted-claw
          # fails on the very PR that adds it, and always would.
          #
          # Reading it from `control` is not a weakening: for a pull_request the
          # workflow file itself is the candidate's, so this step's logic was
          # already candidate-controlled. What the trusted checkout protects is
          # the audit and install code a downstream pin selects, and the
          # classifier is neither. It imports only the standard library, so no
          # sync is needed before the pin comparison runs.
          PYTHONPATH=control/src uv run --no-project python - <<'PY'
          from __future__ import annotations

          import os
          import re
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          rows = (workspace / "fleet/governance-consumers.tsv").read_text(
              encoding="utf-8"
          ).splitlines()
          pins: dict[str, str] = {}
          unpinned: list[str] = []
          for row in rows:
              key, _github, _package_path, pin_path = row.split("\t")
              root = workspace / "fleet" / key
              # A consumer claw has declared but which has not vendored yet has
              # no pin file. Reading it with check=True turned that state into a
              # CalledProcessError, replacing the rollout message with a
              # traceback on the first Mech to reach it (#309).
              exists = subprocess.run(
                  ["git", "-C", str(root), "cat-file", "-e", f"HEAD:{pin_path}"],
                  capture_output=True,
              )
              if exists.returncode != 0:
                  unpinned.append(key)
                  continue
              content = subprocess.run(
                  ["git", "-C", str(root), "show", f"HEAD:{pin_path}"],
                  check=True,
                  capture_output=True,
              ).stdout
              if re.fullmatch(rb"[0-9a-f]{40}\n?", content) is None:
                  raise SystemExit(f"{key} has an invalid committed claw pin")
              pins[key] = content.decode("ascii").strip()

          # Classified by the trusted package, not inline here: logic in a
          # workflow cannot be tested, which is how #284 shipped two guards
          # that could not fail. Both outcomes are still failures -- the
          # contract is one shared pin -- but the message now says whether the
          # fleet is mid-rollout or genuinely drifted (#267).
          from kg_microbe_governance.pin_divergence import classify_pin_divergence

          trusted = workspace / "fleet/trusted-claw"

          def is_ancestor(older: str, newer: str) -> bool:
              if older == newer:
                  return True
              return subprocess.run(
                  ["git", "-C", str(trusted), "merge-base", "--is-ancestor",
                   older, newer],
                  capture_output=True,
              ).returncode == 0

          kind, message = classify_pin_divergence(pins, is_ancestor, unpinned)
          if kind != "converged":
              raise SystemExit(f"{message}. Pins: {dict(sorted(pins.items()))}")
          ref = set(pins.values()).pop()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"ref={ref}\n")
          PY

      - name: Authenticate pin against trusted claw history
        if: steps.automatic.outputs.available != 'true' && steps.release-contract.outputs.active != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ steps.fleet-pin.outputs.ref }}"
          git -C fleet/trusted-claw cat-file -e "${ref}^{commit}"
          if ! git -C fleet/trusted-claw merge-base --is-ancestor "$ref" HEAD; then
            echo "::error::Fleet pin is not reachable from trusted claw base/main" >&2
            exit 2
          fi

      - name: Audit all governed artifacts at committed main tips
        if: steps.automatic.outputs.available != 'true' && steps.release-contract.outputs.active != 'true'
        shell: bash
        run: |
          set -euo pipefail
          audit_args=(
            fleet-audit
            --ref "${{ steps.fleet-pin.outputs.ref }}"
          )
          while IFS=$'\t' read -r key _github _package_path _pin_path; do
            audit_args+=(
              --target-root "$key=$GITHUB_WORKSPACE/fleet/$key"
            )
          done < fleet/governance-consumers.tsv
          uv run --project fleet/trusted-claw kg-microbe-governance \
            "${audit_args[@]}"

      - name: Audit the trusted bounded canary release
        if: steps.automatic.outputs.available != 'true' && steps.release-contract.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_args=(--trusted-root "$GITHUB_WORKSPACE/fleet/trusted-claw")
          while IFS=$'\t' read -r key _github _package_path _pin_path; do
            release_args+=(--target-root "$key=$GITHUB_WORKSPACE/fleet/$key")
          done < fleet/governance-consumers.tsv
          uv run --project fleet/trusted-claw python -m kg_microbe_governance.cycle_release_audit \
            "${release_args[@]}" --json-output "$GITHUB_WORKSPACE/fleet/release-audit.json"

      # The consumer-completeness guard (#259) needs a checkout per consumer, so
      # everywhere without one it skipped every per-consumer case -- which was
      # everywhere, including this workflow, which ran the four files above and
      # not this one. It had never executed its failure path (#209, #216).
      # The trusted deployed fleet above excludes a consumer newly declared by
      # a PR. Derive this candidate check's own roots from its validated package
      # and clone additions before running the mandatory completeness guard.
      # This does not add candidate consumers to the trusted deployed audit.
      # FLEET_CONSUMER_ROOTS_REQUIRED
      # turns an unresolvable root from a silent skip into a failure, so the
      # step cannot pass by examining nothing.
      - name: Check every declared consumer carries what the manifest says
        if: steps.automatic.outputs.available != 'true'
        shell: bash
        env:
          FLEET_CONSUMER_ROOTS_REQUIRED: "1"
        run: |
          set -euo pipefail
          uv run --project control --extra dev python - > fleet/candidate-governance-consumers.tsv <<'PY'
          from kg_microbe_governance import load_governance_manifest

          manifest = load_governance_manifest()
          for consumer in manifest.consumers.values():
              print("\t".join((consumer.key, consumer.github, consumer.package_path, manifest.pin_path)))
          PY
          test -s fleet/candidate-governance-consumers.tsv
          while IFS=$'\t' read -r key github package_path pin_path; do
            root="$GITHUB_WORKSPACE/fleet/$key"
            if [ ! -e "$root" ]; then
              # Completeness reads only origin/main tree entries with ls-tree;
              # it needs no checkout of downstream code or governed payloads.
              git clone --filter=blob:none --no-checkout --depth 1 --branch main \
                "https://github.com/$github.git" "$root"
            fi
            test "$(git -C "$root" remote get-url origin)" = "https://github.com/$github.git"
            var="$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]')_ROOT"
            export "$var=$GITHUB_WORKSPACE/fleet/$key"
          done < fleet/candidate-governance-consumers.tsv
          uv run --project control --extra dev python -m pytest -q \
            control/tests/test_vendored_consumer_completeness.py

  candidate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Validate candidate authority contract
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project control --locked --extra dev
          tests=(
            control/tests/test_fleet_manifest.py
            control/tests/test_kg_microbe_governance.py
            control/tests/test_governance_cycle_release_audit.py
            control/tests/test_governance_infrastructure_admission.py
            control/tests/test_governance_cycle_release_workflow.py
            control/tests/test_id_label_workflow.py
            control/tests/test_authoritative_governance_layout.py
          )
          if [ -f control/tests/test_governance_consumer_admission.py ]; then
            tests+=(control/tests/test_governance_consumer_admission.py)
          fi
          uv run --project control --locked --extra dev python -m pytest -q "${tests[@]}"

  verified-fleet:
    name: fleet-audit
    permissions:
      contents: read
      actions: read
    needs: [candidate-contracts, fleet-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require both component jobs to succeed
        env:
          CANDIDATE_RESULT: ${{ needs.candidate-contracts.result }}
          PUBLIC_RESULT: ${{ needs.fleet-audit.result }}
        run: test "$CANDIDATE_RESULT" = success && test "$PUBLIC_RESULT" = success
      # Event checkout is not executed. It retains the queue's explicit subject
      # checkout contract; all verifier code comes from the protected checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.sha || 'main' }}
          path: fleet/trusted-claw
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Install protected verifier dependencies
        run: uv sync --project fleet/trusted-claw --locked --no-dev
      - name: Verify exact full coverage or public-only bootstrap
        env:
          GH_PUBLIC_READ_TOKEN: ${{ github.token }}
          SCALEUP_AUDIT_EXPECTED_APP_ID: ${{ vars.SCALEUP_AUDIT_EXPECTED_APP_ID }}
          AUTOMATIC_AVAILABLE: ${{ needs.fleet-audit.outputs.automatic_available }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trusted="$GITHUB_WORKSPACE/fleet/trusted-claw"
          if [ -f "$trusted/src/kg_microbe_governance/automatic_private_audit_cli.py" ]; then
            test "$AUTOMATIC_AVAILABLE" = true
            uv run --project "$trusted" --locked --no-dev python -m kg_microbe_governance.automatic_private_audit_cli \
              verify --trusted-root "$trusted" --checkout-sha "$CANDIDATE_SHA"
          else
            test "$AUTOMATIC_AVAILABLE" = false
            python3 -I - <<'PYCODE'
          import json
          from pathlib import Path
          for root in ("control", "fleet/trusted-claw"):
              value = json.loads((Path(root) / "src/kg_microbe_governance/vendored_artifacts.json").read_bytes())
              if "scaleupmech" in value["consumers"]:
                  raise SystemExit("Private obligations require the protected automatic adapter")
          print("Existing protected public-only audit passed; private automation is not active")
          PYCODE
          fi
