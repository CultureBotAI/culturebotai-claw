name: Knowledge-gap scan

# Weekly Europe PMC knowledge-gap scan across the four Discussion-bearing Mechs.
#
# The scanner library lives in claw, so one fleet workflow keeps scheduling and
# scanner versions aligned. ProteinTraitsMech is intentionally excluded: its
# 424k+ ontology-derived records have no Discussion slot, and a 300-record daily
# window would take roughly four years to cover once. Its source/category-focused
# research workflows are the supported mechanism instead. See docs/KGSCAN_SCOPE.md.
#
# Deliberately NO agent and NO write access. It runs the same deterministic
# `just knowledge-gap-scan` a curator runs by hand, in dry-run, and publishes the
# triage packet as an artifact. Turning packets into issues is a separate, later
# step — see docs/AUTONOMOUS_LOOPS.md §5.4.

on:
  schedule:
    # 07:00 UTC = midnight US/Pacific. Sits between id-label-canon (06:41) and
    # cross-repo-validation (07:27) without overlapping either.
    #
    # DAILY, but each run scans a bounded WINDOW rather than the whole corpus —
    # see the matrix below. A full scan is not viable: measured throughput is
    # ~2.8 s/record, so CultureMech's 4,287 records would take ~3h20m and MIM's
    # 1,879 ~1h28m, both of which the 45-minute timeout would kill mid-run.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Records per Mech this run (0 = the matrix default window)"
        required: false
        default: "0"
        type: string
      offset:
        description: "Start this many records in, wrapping (blank = derived from run number)"
        required: false
        default: ""
        type: string
      min_score:
        description: "Override the per-repo min_score gate (blank = config default)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: knowledge-gap-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false   # one Mech's failure must not hide the other three
      matrix:
        include:
          - mech: CultureMech
            repository: CultureBotAI/CultureMech
            checkout_path: CultureMech
            workdir: CultureMech
            window: 300   # of ~4,287 records — full coverage every ~15 runs
          - mech: MediaIngredientMech
            repository: CultureBotAI/MediaIngredientMech
            checkout_path: MediaIngredientMech
            workdir: MediaIngredientMech
            window: 300   # of ~1,879 records — full coverage every ~7 runs
          - mech: CommunityMech
            repository: CultureBotAI/CommunityMech
            checkout_path: CommunityMech
            # NOT nested. The extra CommunityMech/ level exists only in the
            # developer's local clone layout; the repo root holds justfile, conf
            # and kb directly.
            workdir: CommunityMech
            window: 305   # the whole corpus fits inside one run
          - mech: TraitMech
            repository: CultureBotAI/TraitMech
            checkout_path: TraitMech
            workdir: TraitMech
            window: 300   # of ~477 records — full coverage every 2 runs

    steps:
      - name: Checkout claw (hosts kg_microbe_kgscan)
        uses: actions/checkout@v4
        with:
          path: culturebotai-claw

      - name: Checkout ${{ matrix.mech }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          path: ${{ matrix.checkout_path }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync ${{ matrix.mech }} environment
        working-directory: ${{ matrix.workdir }}
        # The recipe runs `uv run python`, matching how these repos are actually
        # used, so the Mech's own environment has to exist. This is heavier than
        # a bare `pip install pyyaml` — CultureMech in particular pulls a large
        # tree — but it is the only way the scan runs against the same
        # dependencies a curator has locally.
        run: uv sync

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run knowledge-gap scan (dry-run)
        id: scan
        working-directory: ${{ matrix.workdir }}
        env:
          # Absolute path sidesteps the differing relative depths across Mechs
          # (CommunityMech is nested, the others are not).
          CLAW_SRC: ${{ github.workspace }}/culturebotai-claw/src
          # Inputs come through env, never interpolated into the script body:
          # `${{ }}` is substituted textually before bash parses, so an input
          # containing $(...) would execute. See #26.
          SCAN_LIMIT: ${{ inputs.limit || '0' }}
          SCAN_MIN_SCORE: ${{ inputs.min_score || '' }}
          SCAN_OFFSET: ${{ inputs.offset || '' }}
          SCAN_WINDOW: ${{ matrix.window }}
          # Advances the window each run so successive scans walk the corpus
          # instead of re-reading the same head forever. The scanner wraps at the
          # end, so this can increment without bound.
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Reject non-numeric input before it reaches the scanner, where it
          # would fail less legibly.
          case "$SCAN_LIMIT" in
            ''|*[!0-9]*) echo "limit must be a non-negative integer, got '$SCAN_LIMIT'" >&2; exit 2 ;;
          esac
          if [ -n "$SCAN_MIN_SCORE" ]; then
            case "$SCAN_MIN_SCORE" in
              *[!0-9]*) echo "min_score must be a non-negative integer, got '$SCAN_MIN_SCORE'" >&2; exit 2 ;;
            esac
          fi
          # A manual --limit overrides the matrix window; otherwise use the window.
          # `if` blocks rather than `[ ... ] && ...`: under `set -e` a trailing
          # false `&&` list exits non-zero, so that idiom is safe only while
          # another command follows it.
          effective_limit="$SCAN_LIMIT"
          if [ "$effective_limit" = "0" ]; then
            effective_limit="$SCAN_WINDOW"
          fi
          if [ -z "$SCAN_OFFSET" ]; then
            SCAN_OFFSET=$(( RUN_NUMBER * SCAN_WINDOW ))
          fi
          case "$SCAN_OFFSET" in
            ''|*[!0-9]*) echo "offset must be a non-negative integer, got '$SCAN_OFFSET'" >&2; exit 2 ;;
          esac
          echo "Scanning $effective_limit records from offset $SCAN_OFFSET"

          args="--limit $effective_limit --offset $SCAN_OFFSET"
          if [ -n "$SCAN_MIN_SCORE" ]; then
            args="$args --min-score $SCAN_MIN_SCORE"
          fi
          # shellcheck disable=SC2086  # deliberate word-splitting of the flag list
          just knowledge-gap-scan $args | tee scan-output.txt

      - name: Summarise
        if: always()
        working-directory: ${{ matrix.workdir }}
        run: |
          {
            echo "## ${{ matrix.mech }} knowledge-gap scan"
            echo
            if [ -f scan-output.txt ]; then
              echo '```'
              tail -5 scan-output.txt
              echo '```'
            else
              echo "Scan produced no output — the step above failed before writing anything."
            fi
            if [ -f reports/knowledge_gap_scan.md ]; then
              echo
              echo "<details><summary>Triage packet (first 60 lines)</summary>"
              echo
              echo '```markdown'
              head -60 reports/knowledge_gap_scan.md
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload triage packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-gap-scan-${{ matrix.mech }}
          path: |
            ${{ matrix.workdir }}/reports/knowledge_gap_scan.json
            ${{ matrix.workdir }}/reports/knowledge_gap_scan.md
          if-no-files-found: warn
          retention-days: 90
