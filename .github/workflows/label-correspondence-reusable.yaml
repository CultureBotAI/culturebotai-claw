# A reusable id<->label correspondence gate, called by each Mech (#132 Phase 5,
# #180).
#
# `label-correspondence.yaml` exists in four Mechs with four distinct hashes and
# one common core: install just + uv, cache the OAK ontologies, generate a drift
# report, upload it, then fail on any error-class verdict. What legitimately
# differs is the Python version, which recipes build the product the gate reads,
# and where the report lands -- so those are inputs, and everything else lives
# here once.
#
# What does NOT move here: each Mech's `paths:` trigger filter, which is scoped
# to that corpus, and its domain-specific gates -- CommunityMech's
# `validate-terms-taxa` and `validate-terms-all` are extra jobs in its own
# caller, not something this workflow knows about. Consolidation must not erase
# a gate that only one repository needs.
#
# A reusable workflow is only exercised by a caller, so this file proves nothing
# until a Mech adopts it. TraitMech is the canary; the rest follow only after
# its CI passes for real (#180).

name: label-correspondence (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python the gate runs under; Mechs differ (3.10 to 3.12)."
        required: true
        type: string
      prepare-recipe:
        description: >-
          A just recipe that builds the product the gate reads, run before the
          drift report. CultureMech builds its SSSOM, CommunityMech its KGX
          export; a Mech whose corpus is already on disk leaves this empty.
        required: false
        default: ""
        type: string
      drift-report-recipe:
        description: "just recipe that writes the drift report."
        required: false
        default: "report-label-drift"
        type: string
      enforce-recipe:
        description: "just recipe that fails on any error-class verdict."
        required: false
        default: "validate-products"
        type: string
      drift-report-path:
        description: "Where the drift report lands, for the upload."
        required: false
        default: "reports/label_drift.tsv"
        type: string
      uv-sync-args:
        description: >-
          Extra arguments for `uv sync`. CultureMech and MediaIngredientMech
          pass `--frozen`, which refuses to update the lockfile -- a hardening
          this workflow must not quietly drop when they adopt it. Empty by
          default, matching what TraitMech and CommunityMech run today.
        required: false
        default: ""
        type: string
      report-when:
        description: >-
          When to generate and upload the drift report. `always` reports before
          enforcing, so a passing run leaves the baseline a reader compares
          against -- what TraitMech and MediaIngredientMech do.

          `failure` enforces first and reports only if the gate fails.
          `report-label-drift` is a SECOND full validator pass over the same
          corpus: on CultureMech the enforce step alone is 6m14s of an ~11m50s
          run, so reporting unconditionally there adds about half again to
          every green PR. That repository recorded the trade deliberately, and
          consolidation must not reverse it silently (#299).
        required: false
        default: "always"
        type: string
      oak-cache-key:
        description: >-
          Cache key for the OAK sqlite ontologies. Bump the suffix to discard a
          poisoned cache without editing this workflow.
        required: false
        default: "v1"
        type: string

permissions:
  contents: read

jobs:
  label-correspondence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync ${{ inputs.uv-sync-args }}

      # The gate resolves `sqlite:obo:` through OAK, which downloads CHEBI, GO,
      # ENVO, PATO and RO. Caching them is the difference between ~2 minutes and
      # a multi-gigabyte download per run.
      # The month stamp is the whole point (#302, CommunityMech#707). With a
      # fixed key the post-step reports "Cache hit occurred on the primary key
      # ..., not saving cache" in every run, so whatever was stored first is
      # frozen for good and no later download can ever reach the cache. A gate
      # that resolves terms through OAK then answers from a snapshot nobody can
      # refresh.
      #
      # A rotating primary key with a prefix restore-key keeps the hit rate --
      # each month restores the previous month's copy as its base -- while
      # letting the entry be re-saved with anything newly fetched.
      - name: Ontology cache stamp
        id: oak-cache-stamp
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache OAK ontologies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.data/oaklib
          # oak-cache-key stays the manual bust: it is a component of the key
          # rather than the whole of it, so bumping it still discards a
          # poisoned cache.
          key: >-
            oaklib-${{ runner.os }}-${{ inputs.oak-cache-key }}-${{
            steps.oak-cache-stamp.outputs.month }}
          # Exactly one restore-key, and it carries the bust. A broader
          # `oaklib-${{ runner.os }}-` fallback would look right and defeat the
          # bust: restore-keys are tried in order, so a bumped oak-cache-key
          # would miss its own prefix and then match the very entry it was
          # bumped to escape. Rotation still gets a warm start from this one --
          # last month's key shares the prefix.
          restore-keys: |
            oaklib-${{ runner.os }}-${{ inputs.oak-cache-key }}-

      - name: Build the product the gate reads
        if: inputs.prepare-recipe != ''
        run: just ${{ inputs.prepare-recipe }}

      # Report first, and upload with `always()`, so the triage artifact exists
      # on exactly the runs that need it -- the failing ones. CultureMech had
      # this the other way round, generating the report only on failure, which
      # loses the passing-run baseline a reader compares against.
      # The two report-when behaviours differ in ORDER, not just in condition,
      # so both orderings live here and one is skipped. A single step with an
      # `if:` cannot express "run after the gate" and "run before it".

      - name: Generate id-label drift report
        if: inputs.report-when == 'always'
        run: just ${{ inputs.drift-report-recipe }}

      - name: Upload drift report
        if: always() && inputs.report-when == 'always'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: label-drift-report-${{ github.run_id }}
          path: ${{ inputs.drift-report-path }}
          if-no-files-found: warn

      - name: Enforce id-label correspondence
        run: just ${{ inputs.enforce-recipe }}

      # Only reached when the gate failed, and only when the caller asked to
      # pay for the second pass just then rather than on every run.
      - name: Generate id-label drift report (on failure)
        if: failure() && inputs.report-when == 'failure'
        run: just ${{ inputs.drift-report-recipe }}

      - name: Upload drift report (on failure)
        if: failure() && inputs.report-when == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: label-drift-report-${{ github.run_id }}
          path: ${{ inputs.drift-report-path }}
          if-no-files-found: warn
