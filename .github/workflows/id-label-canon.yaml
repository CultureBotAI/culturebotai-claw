name: canonical ID-label contract

# Exercise the authoritative packaged validator and its three behavioral
# contracts directly. The separate governance-fleet-audit workflow verifies
# every deployed artifact and immutable pin across the five Mech mains.

on:
  # Keep the canonical dependency/behavior canary independent of source changes.
  # It follows the 06:41 governance fleet audit and precedes heavier fleet jobs.
  schedule:
    - cron: "51 6 * * *"
  pull_request:
    paths:
      - "src/kg_microbe_governance/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/id-label-canon.yaml"
  push:
    branches: [main]
    paths:
      - "src/kg_microbe_governance/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/id-label-canon.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  id-label-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest oaklib
      - name: Run canonical ID-label behavioral tests
        working-directory: src/kg_microbe_governance/artifacts
        run: |
          python -m pytest -q \
            tests/test_id_label_empty_adapter.py \
            tests/test_id_label_unknown_prefix.py \
            tests/test_id_label_plausibility.py
