name: tests

# claw had NO pull-request CI at all: its three workflows were schedule- or
# push-to-main-only. That is how PR #25 merged with a gate that did not gate —
# it was reviewed by a human and by nothing else. This closes that hole.
#
# Deliberately NO `paths:` filter. CultureMech learned this in its own #129/#130:
# tests here span scripts/, src/, plugins/ and tests/, and a path-filtered gate is
# precisely how a change lands unchecked.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync environment
        # --extra dev here AND on the `uv run` below: uv re-syncs to the DEFAULT
        # groups on each run and prunes what an extra brought in, so syncing once
        # is not enough. Only pytest needs it — linkml is a runtime dependency.
        run: uv sync --extra dev

      - name: Lint maintained Python
        run: uvx ruff@0.16.3 check cli plugins pipelines src tests

      - name: Type-check safety-critical modules
        run: >-
          uv run --extra dev mypy
          cli/main.py
          plugins/repository_settings.py
          plugins/lock_manager.py
          plugins/git_integration.py
          plugins/just_runner.py
          src/kg_microbe_history
          src/kg_microbe_kgscan
          src/kg_microbe_fleet
          src/kg_microbe_research
          src/kg_microbe_write
          src/kg_microbe_consistency
          src/kg_microbe_governance/__init__.py
          src/kg_microbe_governance/__main__.py
          src/kg_microbe_governance/fleet_audit.py
          src/kg_microbe_governance/artifacts/scripts/check_vendored_sync.py

      - name: Verify active cron profile
        run: uv run python scripts/apply_cron_profile.py --check-active

      - name: Run tests
        # `python -m pytest`, NOT `uv run pytest`. The latter resolves a pytest
        # from PATH when one is present outside the project, which locally meant
        # a different interpreter with a different set of installed packages —
        # 116 tests collected with import errors instead of 136 clean. `-m`
        # guarantees the project interpreter.
        run: >-
          uv run --extra dev python -m pytest -q
          --cov=src
          --cov=cli.main
          --cov=plugins.repository_settings
          --cov=plugins.lock_manager
          --cov=plugins.git_integration
          --cov=plugins.just_runner
          --cov-report=term-missing
          --cov-fail-under=70

      - name: Enforce safety-module coverage
        run: >-
          uv run --extra dev coverage report
          --include=cli/main.py,plugins/repository_settings.py,plugins/lock_manager.py,plugins/git_integration.py,plugins/just_runner.py
          --fail-under=60

  history-round-trip:
    # The history layer's own guarantee, exercised end to end rather than trusted:
    # a scaffolded record must validate, and an unfilled one must not.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync environment
        # No --extra needed: linkml is a runtime dependency, so a plain sync
        # gives a working linkml-validate.
        run: uv sync

      - name: A filled record validates
        run: |
          set -euo pipefail
          uv run python -m kg_microbe_history new \
            --kind record --slug ci-probe --target-root data \
            --summary "CI round-trip probe" \
            --details "Scaffolded by the tests workflow to prove the layer works end to end." \
            --history-root "$RUNNER_TEMP/history"
          # Deliberately omit --schema: this lane proves that the project CLI
          # resolves the canonical schema from kg_microbe_governance package data.
          # The from-sdist wheel test separately proves installed-package behavior.
          uv run python -m kg_microbe_history validate "$RUNNER_TEMP/history"

      - name: An unfilled record is rejected by BOTH gates
        run: |
          set -euo pipefail
          uv run python -m kg_microbe_history new \
            --kind record --slug ci-placeholder --target-root data \
            --summary "no details supplied" \
            --history-root "$RUNNER_TEMP/placeholder"

          if uv run python -m kg_microbe_history validate "$RUNNER_TEMP/placeholder" \
               --structural-only; then
            echo "::error::the CLI accepted a TODO-placeholder record" >&2
            exit 1
          fi

          # The Mechs validate with plain linkml-validate against their governed
          # copies, so the canonical schema must reject it without our CLI in the
          # loop.
          record=$(find "$RUNNER_TEMP/placeholder" -name '*.yaml' | head -1)
          if uv run linkml-validate \
               --schema src/kg_microbe_governance/artifacts/schema/history.yaml \
               --target-class HistoryRecord "$record"; then
            echo "::error::the schema accepted a TODO-placeholder record" >&2
            exit 1
          fi
          echo "Both gates rejected the placeholder, as intended."
