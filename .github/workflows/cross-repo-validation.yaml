name: Cross-repo validation

on:
  schedule:
    - cron: "27 7 * * *"   # daily at 07:27 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/validate_evidence_references.py"
      - "scripts/inventory_unmapped_ingredients.py"
      - "scripts/generate_kg_microbe_review.py"
      - ".github/workflows/cross-repo-validation.yaml"
      - ".claude/skills/**"
      - "src/kg_microbe_skills/**"

permissions:
  contents: read
  issues: write   # to open follow-up issues on failure
  actions: read   # to name the step that failed in that issue (see below)

concurrency:
  group: cross-repo-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claw
        uses: actions/checkout@v4
        with:
          path: culturebotai-claw

      # The three Mechs below are the unmapped-ingredient INPUT SET, not fleet
      # membership: they are the corpora scripts/inventory_unmapped_ingredients.py
      # defines loaders for. The set is declared in the packaged manifest as the
      # `unmapped_inventory_input` capability, and
      # tests/test_cross_repo_validation_scope.py fails if these checkouts and
      # that declaration diverge. TraitMech and ProteinTraitsMech are declared
      # not_applicable there with reasons; they are not omissions (#131).
      - name: Checkout MediaIngredientMech
        uses: actions/checkout@v4
        with:
          repository: CultureBotAI/MediaIngredientMech
          path: MediaIngredientMech

      - name: Checkout CultureMech
        uses: actions/checkout@v4
        with:
          repository: CultureBotAI/CultureMech
          path: CultureMech
        # Was continue-on-error with the comment "private repo may not be
        # accessible". CultureMech is public (verified 2026-07-31), so a failed
        # checkout is a real fault, and swallowing it let downstream validation
        # steps silently run against a missing tree.

      - name: Checkout CommunityMech
        uses: actions/checkout@v4
        with:
          repository: CultureBotAI/CommunityMech
          path: CommunityMech
        # Also public (verified 2026-07-31) — same reasoning as CultureMech above.

      # Install the locked project environment and enter it for every validator.
      # The earlier project-install fix (#398) addressed the missing dotenv
      # dependency; this keeps installation and execution on the same runtime.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          working-directory: culturebotai-claw

      - name: Sync claw's declared environment
        working-directory: culturebotai-claw
        run: uv sync --frozen

      - name: Validate evidence references (MIM)
        working-directory: culturebotai-claw
        env:
          MEDIAINGREDIENTMECH_ROOT: ${{ github.workspace }}/MediaIngredientMech
        run: |
          uv run --frozen python scripts/validate_evidence_references.py
        continue-on-error: false

      - name: Inventory unmapped ingredients
        working-directory: culturebotai-claw
        env:
          MEDIAINGREDIENTMECH_ROOT: ${{ github.workspace }}/MediaIngredientMech
          CULTUREMECH_ROOT: ${{ github.workspace }}/CultureMech
          # Was CommunityMech-outer/CommunityMech, a path that has never existed
          # on a runner — the extra level is a local clone artifact. A `|| true`
          # here used to mean the inventory silently ran without CommunityMech
          # data; it is gone, and --require-sources now makes the same class of
          # regression fail instead of shrinking the report (#131, #161).
          COMMUNITYMECH_ROOT: ${{ github.workspace }}/CommunityMech
        run: |
          # kg-microbe is deliberately NOT required: it is an external corpus
          # this workflow does not check out, so its two sources are expected to
          # report ABSENT here. The report states that rather than implying the
          # inventory was complete.
          uv run --frozen python scripts/inventory_unmapped_ingredients.py \
            --require-sources MIM:unmapped \
            --require-sources MIM:mapped-placeholder \
            --require-sources culturemech:pending \
            --require-sources communitymech:unmapped

      # The offline half of this check runs in pytest on every PR, against
      # claw alone. Here three Mech checkouts exist, so paths that claw cannot
      # resolve by itself get judged too. kg-microbe, TraitMech and
      # ProteinTraitsMech are not checked out: their references report as
      # unverifiable, which the run states rather than passing over.
      - name: Check skill references
        working-directory: culturebotai-claw
        env:
          MEDIAINGREDIENTMECH_ROOT: ${{ github.workspace }}/MediaIngredientMech
          CULTUREMECH_ROOT: ${{ github.workspace }}/CultureMech
          COMMUNITYMECH_ROOT: ${{ github.workspace }}/CommunityMech
        run: |
          uv run --frozen python -m kg_microbe_skills check

      - name: Upload inventory + validation reports
        # The job stops at the first failed step, so without this the reports
        # are uploaded only on the runs nobody needs them for. Every failing
        # run in #376 skipped this step while the issue it opened said
        # "inspect the workflow artifacts". `!cancelled()` rather than
        # `always()`: a cancelled run has nothing worth uploading.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-repo-validation-${{ github.run_id }}
          path: |
            culturebotai-claw/workspace/reports/evidence_reference_validation.tsv
            culturebotai-claw/workspace/reports/evidence_reference_validation.md
            culturebotai-claw/workspace/reports/unmapped_inventory.tsv
            culturebotai-claw/workspace/reports/unmapped_inventory.md
            culturebotai-claw/workspace/reports/unmapped_inventory_coverage.tsv
          retention-days: 30
          if-no-files-found: warn

      - name: Open issue on validation failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `Cross-repo validation failed (${today})`;
            // Report WHICH step failed; do not guess WHY. This body used to
            // assert "a snippet in MIM evidence does not match its cached
            // PubMed abstract" as the likely cause of every failure. In #376
            // the run had died importing python-dotenv before reading a
            // record, and four notices carried that sentence while the name
            // of the failing step -- which the run knows -- went unprinted.
            let where =
              "No step reported a failure conclusion; read the run log directly.";
            try {
              const { data: listing } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              const failed = listing.jobs
                .flatMap((job) => (job.steps || []).map((step) => ({ job, step })))
                .filter(({ step }) => step.conclusion === "failure")
                .map(({ job, step }) => `\`${job.name}\` -> \`${step.name}\``);
              if (failed.length) {
                where = `Failed step(s): ${failed.join(", ")}.`;
              }
            } catch (error) {
              // Naming the step is a nicety; opening the issue is the point.
              // #376 ran four days on a misleading body. On a dropped scope or
              // a rate limit it would otherwise run silently on no body at all,
              // which is strictly worse.
              where =
                `Could not list this run's steps (${error.message}); read the run log directly.`;
            }
            const body = `Daily cross-repo validation failed in [run #${context.runNumber}](${context.payload.repository.html_url}/actions/runs/${context.runId}).\n\n` +
              `${where}\n\n` +
              `This job runs three independent gates -- evidence-reference validation, ` +
              `the unmapped-ingredient inventory, and the skill-reference check -- plus ` +
              `its own environment setup. Read that step's log before assuming a data ` +
              `finding. Reports are uploaded as artifacts on every run that was not ` +
              `cancelled.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: "cross-repo-validation",
              state: "open",
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["cross-repo-validation", "bug"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            }
